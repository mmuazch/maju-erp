/* ---------- generic list page ---------- */
function docList(cfg) {
  const render = () => {
    const f = { from: $('#dFrom').value, to: $('#dTo').value, q: $('#dQ').value.toLowerCase() };
    let rows = DB.data[cfg.key].filter(d => (!f.from || d.date >= f.from) && (!f.to || d.date <= f.to));
    if (f.q) rows = rows.filter(d => (d.no + ' ' + (cfg.partyName ? cfg.partyName(d) : '') + ' ' + (d.memo || d.notes || d.ref || '')).toLowerCase().includes(f.q));
    rows.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
    $('#dList').innerHTML = table(cfg.columns, rows, { rowAttr: d => `data-href="#/${cfg.path}/${d.id}" class="clickable"`, empty: `No ${cfg.title.toLowerCase()} in this period.`,
      foot: cfg.totalOf ? [...cfg.columns.slice(0, -2).map((c, i) => ({ v: i === 0 ? `<b>${rows.length} record(s)</b>` : '' })), { cls: 'num', v: `<b>${U.money(U.sum(rows, cfg.totalOf))}</b>` }, {}] : null });
    bindRowLinks($('#dList'));
  };
  page(cfg.title, `<div class="card"><div class="toolbar">
      <div class="search">${icon('search')}<input id="dQ" placeholder="Search number, party…"></div>
      <label class="inl">From <input type="date" id="dFrom" value="${U.fyStart(U.today(), DB.data.settings.fyStartMonth)}"></label>
      <label class="inl">To <input type="date" id="dTo"></label></div><div id="dList"></div></div>`,
    `<a class="btn primary" href="#/${cfg.path}/new">${icon('plus')} New ${cfg.singular}</a>`);
  ['dQ', 'dFrom', 'dTo'].forEach(id => $('#' + id).oninput = render);
  render();
}

/* ---------- generic line-document editor ---------- */
function docEditor(cfg, id, qs = {}) {
  const existing = id !== 'new' ? DB.get(cfg.key, id) : null;
  if (id !== 'new' && !existing) return go('#/' + cfg.path);
  const doc = existing ? JSON.parse(JSON.stringify(existing)) : cfg.blank(qs);
  if (!doc.lines || !doc.lines.length) doc.lines = [cfg.newLine(doc)];

  const head = () => cfg.head.map(f => field(f, doc[f.name])).join('');
  const lineRow = (l, i) => `<tr data-line="${i}">${cfg.cols.map(c => {
    if (c.type === 'calc') return `<td class="num calc" data-calc="${c.name}">${c.calc(l, doc)}</td>`;
    if (c.type === 'select') return `<td class="${c.cls || ''}"><select data-k="${c.name}">${c.options(l, doc)}</select>${c.sub ? `<div class="sub">${c.sub(l, doc)}</div>` : ''}</td>`;
    return `<td class="${c.cls || ''}"><input data-k="${c.name}" type="${c.type || 'text'}" ${c.type === 'number' ? 'step="any"' : ''} value="${U.esc(l[c.name] ?? '')}"></td>`;
  }).join('')}<td class="x"><button class="icon-btn" data-rm="${i}" title="Remove line">${icon('x')}</button></td></tr>`;
  const renderLines = () => {
    $('#lines tbody').innerHTML = doc.lines.map(lineRow).join('');
    bindLines(); renderTotals();
  };
  const renderTotals = () => {
    $$('#lines tr[data-line]').forEach(tr => { const l = doc.lines[+tr.dataset.line]; $$('[data-calc]', tr).forEach(td => { td.innerHTML = cfg.cols.find(c => c.name === td.dataset.calc).calc(l, doc); }); });
    $('#totals').innerHTML = cfg.totals(doc);
    bindTotals();
  };
  const bindTotals = () => $$('#totals [data-h]').forEach(el => el.oninput = el.onchange = () => { doc[el.dataset.h] = el.value; if (el.tagName === 'SELECT' || el.type !== 'number') return; renderTotals(); setTimeout(() => { const n = $(`#totals [data-h="${el.dataset.h}"]`); if (n) { n.focus(); const v = n.value; n.value = ''; n.value = v; } }); });
  const bindLines = () => {
    $$('#lines [data-k]').forEach(el => {
      const i = +el.closest('tr').dataset.line, k = el.dataset.k, col = cfg.cols.find(c => c.name === k);
      const h = () => { doc.lines[i][k] = el.value; if (col.onChange) col.onChange(doc.lines[i], doc); if (col.rerender) renderLines(); else renderTotals(); };
      if (el.tagName === 'SELECT') el.onchange = h; else el.oninput = h;
    });
    $$('#lines [data-rm]').forEach(b => b.onclick = () => { doc.lines.splice(+b.dataset.rm, 1); if (!doc.lines.length) doc.lines.push(cfg.newLine(doc)); renderLines(); });
  };

  const title = existing ? `${cfg.singular} ${doc.no}` : 'New ' + cfg.singular;
  page(title, `<div class="card pad doc">
      ${cfg.banner ? cfg.banner(doc) : ''}<form id="hForm" class="grid3">${head()}</form>
      <div class="tbl-wrap"><table class="tbl lines" id="lines"><thead><tr>${cfg.cols.map(c => `<th class="${c.hcls || c.cls || ''}">${c.label}</th>`).join('')}<th></th></tr></thead><tbody></tbody></table></div>
      <button class="btn ghost sm" id="addLine">${icon('plus')} Add line</button>
      <div class="doc-foot"><div class="doc-notes">${cfg.footFields ? cfg.footFields.map(f => field(f, doc[f.name])).join('') : ''}</div><div id="totals" class="totals"></div></div>
      <div class="form-foot">
        ${existing ? `<button class="btn danger ghost" id="dDel">${icon('trash')} Delete</button>` : ''}
        ${existing && cfg.extraButtons ? cfg.extraButtons(doc) : ''}
        <span class="sp"></span>
        ${existing && cfg.print ? `<button class="btn" id="dPrint">${icon('print')} Print</button>` : ''}
        <a class="btn" href="#/${cfg.path}">Cancel</a>
        <button class="btn" id="dSaveNew">Save & New</button>
        <button class="btn primary" id="dSave">Save</button>
      </div></div><div id="printArea"></div>`, '', [[cfg.title, '#/' + cfg.path]]);
  renderLines();
  if (cfg.onHeadChange) $$('#hForm [name]').forEach(el => el.addEventListener('change', () => { Object.assign(doc, readForm($('#hForm'))); cfg.onHeadChange(doc, el.name); renderLines(); }));
  $('#addLine').onclick = () => { doc.lines.push(cfg.newLine(doc)); renderLines(); $$('#lines tr:last-child select, #lines tr:last-child input')[0]?.focus(); };

  const save = andNew => {
    Object.assign(doc, readForm($('#hForm')));
    if (cfg.footFields) cfg.footFields.forEach(f => { const el = $(`[name="${f.name}"]`); if (el) doc[f.name] = el.value; });
    doc.lines = doc.lines.filter(cfg.keepLine);
    if (isLocked(doc.date) || (existing && isLocked(existing.date))) return toast(lockMsg(), 'err');
    const err = cfg.validate(doc);
    if (err) { if (!doc.lines.length) doc.lines.push(cfg.newLine(doc)); renderLines(); return toast(err, 'err'); }
    if (!doc.no) doc.no = DB.nextNo(cfg.prefix);
    if (cfg.beforeSave) cfg.beforeSave(doc);
    DB.upsert(cfg.key, doc);
    toast(`${cfg.singular} ${doc.no} saved`);
    go(andNew ? `#/${cfg.path}/new` : `#/${cfg.path}/${doc.id}`);
  };
  $('#dSave').onclick = () => save(false);
  $('#dSaveNew').onclick = () => save(true);
  if (existing) {
    $('#dDel').onclick = () => isLocked(existing.date) ? toast(lockMsg(), 'err') : confirmBox(`Delete ${cfg.singular.toLowerCase()} ${doc.no}? Its postings will be reversed.`, () => { DB.remove(cfg.key, doc.id); toast('Deleted'); go('#/' + cfg.path); });
    if (cfg.print) $('#dPrint').onclick = () => { $('#printArea').innerHTML = cfg.print(existing); window.print(); };
    if (cfg.bindExtra) cfg.bindExtra(existing);
  }
}

/* ---------- trade documents (sales & purchase flows) ---------- */
const TK = {
  estimate: { key: 'quotations', path: 'estimates', title: 'Estimates', singular: 'Estimate', prefix: 'EST', S: true, priced: true, to: ['so', 'invoice'] },
  so: { key: 'salesOrders', path: 'sales-orders', title: 'Sales Orders', singular: 'Sales Order', prefix: 'SO', S: true, priced: true, to: ['dn', 'invoice'] },
  dn: { key: 'deliveryNotes', path: 'delivery-notes', title: 'Delivery Notes', singular: 'Delivery Note', prefix: 'DN', S: true, priced: false, stock: true, to: ['invoice', 'dnr'] },
  dnr: { key: 'dnReturns', path: 'delivery-note-returns', title: 'Delivery Note Returns', singular: 'Delivery Note Return', prefix: 'DNR', S: true, priced: false, stock: true, to: [] },
  invoice: { key: 'invoices', path: 'invoices', title: 'Invoices', singular: 'Invoice', prefix: 'INV', S: true, priced: true, posts: true, stock: true, to: ['sret'] },
  sret: { key: 'salesReturns', path: 'sales-returns', title: 'Sales Returns', singular: 'Sales Return', prefix: 'SR', S: true, priced: true, credit: true, stock: true, to: [] },
  pr: { key: 'purchaseRequests', path: 'purchase-requests', title: 'Purchase Requests', singular: 'Purchase Request', prefix: 'PRQ', S: false, priced: false, optionalParty: true, to: ['po'] },
  po: { key: 'purchaseOrders', path: 'purchase-orders', title: 'Purchase Orders', singular: 'Purchase Order', prefix: 'PO', S: false, priced: true, to: ['grn', 'bill'] },
  grn: { key: 'grns', path: 'grn', title: 'Goods Receive Notes (GRN)', singular: 'GRN', prefix: 'GRN', S: false, priced: true, noTax: true, stock: true, to: ['bill', 'pret'] },
  bill: { key: 'bills', path: 'bills', title: 'Bills', singular: 'Bill', prefix: 'BILL', S: false, priced: true, posts: true, stock: true, to: ['pret'] },
  pret: { key: 'purchaseReturns', path: 'purchase-returns', title: 'Purchase Returns', singular: 'Purchase Return', prefix: 'PRT', S: false, priced: true, credit: true, stock: true, to: [] },
};
const findKindByKey = key => Object.keys(TK).find(k => TK[k].key === key);
function convertedTo(id) {
  for (const k in TK) { const d = DB.data[TK[k].key].find(x => x.fromId === id); if (d) return { k, d }; }
  return null;
}
function tradeStatus(kind, d) {
  const T = TK[kind];
  if (T.posts) return R.docStatus(T.S ? 'C' : 'S', d);
  if (T.credit) return 'Posted';
  if (kind === 'dn') return DB.data.invoices.some(x => x.dnId === d.id) ? 'Invoiced' : 'Not invoiced';
  if (kind === 'grn') return DB.data.bills.some(x => x.grnId === d.id) ? 'Billed' : 'Not billed';
  if (kind === 'dnr') return 'Posted';
  return convertedTo(d.id) ? 'Converted' : 'Open';
}
const salesmanOpts = v => opts((DB.data.salesmen || []).map(s => [s.id, s.name]), v, '— None —');
const projectOpts = v => opts((DB.data.projects || []).map(p => [p.id, `${p.code ? p.code + ' · ' : ''}${p.name}`]), v, '— None —');

function tradeCfg(kind) {
  const T = Object.assign({ kind }, TK[kind]);
  const S = T.S, pk = S ? 'customerId' : 'supplierId', PT = S ? 'C' : 'S';
  const onHand = (itemId, whId) => { const s = R.stock(null, whId)[itemId]; return s ? s.qty : 0; };
  const head = [{ name: pk, label: S ? 'Customer' : (T.optionalParty ? 'Suggested supplier' : 'Supplier'), type: 'select', required: !T.optionalParty, options: v => S ? custOpts(v) : suppOpts(v) },
    { name: 'date', label: 'Date', type: 'date', required: true }];
  if (kind === 'estimate') head.push({ name: 'validUntil', label: 'Expiry date', type: 'date' });
  if (kind === 'so' || kind === 'po') head.push({ name: 'expected', label: kind === 'so' ? 'Expected shipment' : 'Expected delivery', type: 'date' });
  if (kind === 'pr') head.push({ name: 'requiredBy', label: 'Required by', type: 'date' }, { name: 'requestedBy', label: 'Requested by' });
  if (T.posts) head.push({ name: 'dueDate', label: 'Due date', type: 'date' });
  if (T.stock) head.push({ name: 'warehouseId', label: 'Location / warehouse', type: 'select', options: v => whOpts(v) });
  if (S && ['estimate', 'so', 'invoice'].includes(kind)) head.push({ name: 'salesmanId', label: 'Salesman', type: 'select', options: salesmanOpts });
  if (['invoice', 'bill', 'so', 'po'].includes(kind)) head.push({ name: 'projectId', label: 'Project', type: 'select', options: projectOpts });
  if (kind === 'sret') head.push({ name: 'restock', label: 'Return goods to stock', type: 'select', options: v => opts([['yes', 'Yes'], ['no', 'No (damaged / not returned)']], v || 'yes', null) });
  head.push({ name: 'ref', label: S ? 'Reference / customer PO' : 'Supplier ref. / invoice no.' });

  const cols = [
    { name: 'itemId', label: 'Item', type: 'select', cls: 'w-item', rerender: true, options: l => itemOpts(l.itemId),
      sub: (l, doc) => { const it = item(l.itemId); if (!it) return ''; return it.type === 'Service' ? 'Service' : `On hand: ${U.qty(onHand(it.id, doc.warehouseId))} ${U.esc(it.unit || '')}`; },
      onChange: l => { const it = item(l.itemId); if (it) { l.rate = S ? (it.salePrice || '') : (it.costPrice || ''); l.desc = it.description || ''; } } },
    { name: 'desc', label: 'Description', cls: 'w-desc' },
    { name: 'qty', label: 'Qty', type: 'number', cls: 'w-num' },
    { name: 'unit', label: 'Unit', type: 'calc', calc: l => U.esc(item(l.itemId)?.unit || '') },
  ];
  if (T.priced) cols.push(
    { name: 'rate', label: 'Rate', type: 'number', cls: 'w-num' },
    { name: 'disc', label: 'Disc %', type: 'number', cls: 'w-sm' },
    { name: 'amount', label: 'Amount', type: 'calc', calc: l => U.money(U.num(l.qty) * U.num(l.rate) * (1 - U.num(l.disc) / 100)) });

  return Object.assign(T, {
    pk, PT, head, cols,
    blank: qs => {
      const d = { date: U.today(), taxRate: T.noTax ? 0 : DB.data.settings.taxRate, warehouseId: DB.data.warehouses[0]?.id, lines: [] };
      if (qs.from && qs.src && TK[qs.src]) {
        const src = DB.get(TK[qs.src].key, qs.from);
        if (src) {
          const sameSide = TK[qs.src].S === S;
          Object.assign(d, { ref: src.ref || src.no, notes: src.notes, fromId: src.id, fromNo: src.no, salesmanId: src.salesmanId, projectId: src.projectId, warehouseId: src.warehouseId || d.warehouseId,
            lines: JSON.parse(JSON.stringify(src.lines)).map(l => Object.assign(l, { rate: l.rate || (S ? item(l.itemId)?.salePrice : item(l.itemId)?.costPrice) || '' })) });
          if (sameSide) d[pk] = src[pk];
          if (TK[qs.src].priced && !T.noTax && !TK[qs.src].noTax) { d.taxRate = src.taxRate; d.otherCharges = src.otherCharges; }
          if (qs.src === 'dn' && kind === 'invoice') d.dnId = src.id;
          if (qs.src === 'grn' && kind === 'bill') d.grnId = src.id;
          if (qs.src === 'invoice') d.invoiceId = src.id;
          if (qs.src === 'bill') d.billId = src.id;
        }
      }
      if (qs.party) d[pk] = qs.party;
      return d;
    },
    newLine: () => ({ itemId: '', desc: '', qty: 1, rate: '', disc: '' }),
    keepLine: l => l.itemId,
    onHeadChange: (doc, name) => {
      if (name === pk && T.posts) { const p = party(PT, doc[pk]); if (p && U.num(p.terms)) { doc.dueDate = U.addDays(doc.date, U.num(p.terms)); const el = $('#hForm [name=dueDate]'); if (el) el.value = doc.dueDate; } }
    },
    footFields: [{ name: 'notes', label: kind === 'pr' ? 'Purpose / remarks' : 'Notes / terms & conditions', type: 'textarea' }],
    banner: doc => {
      const bits = [];
      if (doc.fromNo) bits.push(`Created from <b>${U.esc(doc.fromNo)}</b>`);
      if (doc.dnId) bits.push('Stock already issued by the delivery note — this invoice will not move stock again');
      if (doc.grnId) bits.push('Stock already received on the GRN — this bill clears Goods Received Not Invoiced');
      if (doc.recurringId) bits.push('Generated by a recurring profile');
      return bits.length ? `<div class="info">${bits.join(' · ')}</div>` : '';
    },
    totals: doc => {
      if (!T.priced) return `<div class="tr grand"><span>Total quantity</span><b>${U.qty(U.sum(doc.lines, l => U.num(l.qty)))}</b></div>`;
      const t = calcDoc(doc);
      const cb = cashBankAccounts();
      const pay = kind === 'invoice' ? ['received', 'Received now in'] : kind === 'bill' ? ['paid', 'Paid now from'] : T.credit ? ['refund', kind === 'sret' ? 'Refunded now from' : 'Refund received in'] : null;
      return `<div class="tr"><span>Sub total</span><b>${U.money(t.gross)}</b></div>
        <div class="tr"><span>Discount</span><b>${U.money(-t.discount)}</b></div>
        ${T.noTax ? '' : `<div class="tr"><span>Sales tax <input data-h="taxRate" type="number" step="any" class="mini" value="${U.esc(doc.taxRate ?? '')}"> %</span><b>${U.money(t.tax)}</b></div>
        <div class="tr"><span>Other charges <input data-h="otherCharges" type="number" step="any" class="mini w" value="${U.esc(doc.otherCharges ?? '')}"></span><b>${U.money(t.other)}</b></div>`}
        <div class="tr grand"><span>Total ${DB.data.settings.currency}</span><b>${U.money(t.total)}</b></div>
        ${pay ? `<div class="tr paid"><span>${pay[1]} <select data-h="${pay[0]}AccountId">${opts(cb.map(a => [a.id, a.name]), doc[pay[0] + 'AccountId'], '—')}</select></span><input data-h="${pay[0]}Amount" type="number" step="any" class="mini w" value="${U.esc(doc[pay[0] + 'Amount'] ?? '')}" placeholder="0.00"></div>` : ''}`;
    },
    validate: doc => {
      if (!doc[pk] && !T.optionalParty) return `Select a ${S ? 'customer' : 'supplier'}`;
      if (!doc.date) return 'Enter a date';
      if (!doc.lines.length) return 'Add at least one item';
      if (doc.lines.some(l => U.num(l.qty) <= 0)) return 'Quantities must be greater than zero';
      for (const p of ['received', 'paid', 'refund']) {
        const amt = U.num(doc[p + 'Amount']);
        if (amt && !doc[p + 'AccountId']) return 'Choose the cash/bank account for the amount entered';
        if (amt > calcDoc(doc).total + 0.005) return 'The amount entered is more than the document total';
      }
      return null;
    },
    beforeSave: doc => { doc.taxRate = U.num(doc.taxRate); doc.lines.forEach(l => { l.qty = U.num(l.qty); l.rate = U.num(l.rate); l.disc = U.num(l.disc); }); },
    extraButtons: doc => T.to.map(k => `<a class="btn" href="#/${TK[k].path}/new?src=${kind}&from=${doc.id}">→ ${TK[k].singular}</a>`).join('') +
      (kind === 'invoice' ? `<a class="btn" href="#/receipts?new=${doc.customerId}">Record payment</a>` : kind === 'bill' ? `<a class="btn" href="#/payments?new=${doc.supplierId}">Record payment</a>` : ''),
    print: doc => printTrade(kind === 'invoice' && U.num(doc.taxRate) ? 'Sales Tax Invoice' : T.singular, doc, PT, pk, T.priced),
  });
}

function printTrade(title, doc, PT, pk, priced = true) {
  const t = calcDoc(doc), p = party(PT, doc[pk]) || {};
  return `<div class="print-doc">${printHeader(title, `<b>${U.esc(doc.no)}</b><br>Date: ${U.fdate(doc.date)}${doc.dueDate ? '<br>Due: ' + U.fdate(doc.dueDate) : ''}${doc.ref ? '<br>Ref: ' + U.esc(doc.ref) : ''}`)}
    <div class="bill-to"><small>${PT === 'C' ? 'Customer' : 'Supplier'}</small><b>${U.esc(p.name || '')}</b><div>${U.esc(p.address || '')} ${U.esc(p.city || '')}</div><div>${[p.phone, p.ntn ? 'NTN: ' + p.ntn : '', p.strn ? 'STRN: ' + p.strn : ''].filter(Boolean).map(U.esc).join(' · ')}</div></div>
    <table class="tbl"><thead><tr><th>#</th><th>Item</th><th class="num">Qty</th>${priced ? '<th class="num">Rate</th><th class="num">Disc %</th><th class="num">Amount</th>' : ''}</tr></thead><tbody>
    ${doc.lines.map((l, i) => `<tr><td>${i + 1}</td><td><b>${U.esc(item(l.itemId)?.name || '')}</b>${l.desc ? `<div class="sm">${U.esc(l.desc)}</div>` : ''}</td><td class="num">${U.qty(l.qty)} ${U.esc(item(l.itemId)?.unit || '')}</td>${priced ? `<td class="num">${U.money(l.rate)}</td><td class="num">${U.num(l.disc) || ''}</td><td class="num">${U.money(l.amount)}</td>` : ''}</tr>`).join('')}
    </tbody></table>
    ${priced ? `<div class="print-totals"><div><span>Sub total</span><b>${U.money(t.gross)}</b></div>${t.discount ? `<div><span>Discount</span><b>${U.money(-t.discount)}</b></div>` : ''}${t.tax ? `<div><span>Sales tax ${U.num(doc.taxRate)}%</span><b>${U.money(t.tax)}</b></div>` : ''}${t.other ? `<div><span>Other charges</span><b>${U.money(t.other)}</b></div>` : ''}<div class="grand"><span>Total ${DB.data.settings.currency}</span><b>${U.money(t.total)}</b></div></div>` : ''}
    ${doc.notes ? `<p><b>Notes:</b> ${U.esc(doc.notes)}</p>` : ''}${PT === 'C' && priced && DB.data.settings.invoiceNote ? `<p class="muted">${U.esc(DB.data.settings.invoiceNote)}</p>` : ''}
    <div class="signs"><div>Prepared by</div><div>Approved by</div><div>Received by</div></div></div>`;
}

function tradeList(kind) {
  const c = tradeCfg(kind);
  const cols = [
    { label: 'Number', html: d => `<b>${U.esc(d.no)}</b>` },
    { label: 'Date', get: d => U.fdate(d.date) },
    { label: c.S ? 'Customer' : 'Supplier', get: d => d[c.pk] ? partyName(c.PT, d[c.pk]) : '—' },
    { label: 'Reference', get: d => d.ref },
    { label: 'Status', html: d => badge(tradeStatus(kind, d)) },
  ];
  cols.push(c.priced ? { label: 'Amount', cls: 'num', get: d => U.money(calcDoc(d).total) } : { label: 'Quantity', cls: 'num', get: d => U.qty(U.sum(d.lines, l => U.num(l.qty))) });
  cols.push({ label: '', cls: 'num', html: () => '›' });
  docList({ key: c.key, path: c.path, title: c.title, singular: c.singular, partyName: d => partyName(c.PT, d[c.pk]), totalOf: c.priced ? d => calcDoc(d).total : null, columns: cols });
}
Object.keys(TK).forEach(k => {
  const p = TK[k].path;
  route('/' + p, () => tradeList(k));
  route('/' + p + '/:id', (id, qs) => docEditor(tradeCfg(k), id, qs));
});

/* ---------- receipts & payments ---------- */
function moneyDocs(S) {
  const key = S ? 'receipts' : 'payments', pk = S ? 'customerId' : 'supplierId', PT = S ? 'C' : 'S';
  const title = S ? 'Payments Received' : 'Payments Made', singular = S ? 'Payment Received' : 'Payment Made';
  const render = () => {
    const rows = DB.data[key].slice().sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
    $('#mList').innerHTML = table([
      { label: 'Number', html: d => `<b>${U.esc(d.no)}</b>` }, { label: 'Date', get: d => U.fdate(d.date) },
      { label: S ? 'Customer' : 'Supplier', get: d => partyName(PT, d[pk]) }, { label: S ? 'Received in' : 'Paid from', get: d => acc(d.accountId)?.name },
      { label: 'Cheque / ref', get: d => d.ref }, { label: 'Tax withheld', cls: 'num', get: d => U.money(d.wht, true) }, { label: 'Amount', cls: 'num', html: d => `<b>${U.money(d.amount)}</b>` },
    ], rows, { rowAttr: d => `data-id="${d.id}" class="clickable"`, empty: `No ${title.toLowerCase()} yet.`, foot: [{ v: `<b>${rows.length} record(s)</b>` }, {}, {}, {}, {}, { cls: 'num', v: `<b>${U.money(U.sum(rows, d => U.num(d.wht)))}</b>` }, { cls: 'num', v: `<b>${U.money(U.sum(rows, d => U.num(d.amount)))}</b>` }] });
    $$('#mList tr[data-id]').forEach(tr => tr.onclick = () => edit(DB.get(key, tr.dataset.id)));
  };
  const edit = (rec, presetParty) => {
    const isNew = !rec;
    rec = rec ? Object.assign({}, rec) : { date: U.today(), accountId: cashBankAccounts()[0]?.id, [pk]: presetParty || '' };
    const m = modal((isNew ? 'New ' : 'Edit ') + singular + (rec.no ? ' ' + rec.no : ''), `<form id="rForm" class="grid2">
      ${field({ name: pk, label: S ? 'Customer' : 'Supplier', type: 'select', required: true, options: v => S ? custOpts(v) : suppOpts(v) }, rec[pk])}
      ${field({ name: 'date', label: 'Date', type: 'date', required: true }, rec.date)}
      ${field({ name: 'accountId', label: S ? 'Received in (cash/bank)' : 'Paid from (cash/bank)', type: 'select', required: true, options: v => accOpts(v, cashBankAccounts()) }, rec.accountId)}
      ${field({ name: 'amount', label: 'Amount', type: 'number', required: true }, rec.amount)}
      ${field({ name: 'wht', label: S ? 'Income tax withheld by customer' : 'Withholding tax deducted', type: 'number', hint: S ? 'Credited to the customer along with the amount' : 'Settles the bill but is payable to tax authority' }, rec.wht)}
      ${field({ name: 'ref', label: 'Cheque no. / reference' }, rec.ref)}
      ${field({ name: 'memo', label: 'Narration', wide: true }, rec.memo)}
    </form><div class="info" id="pBal"></div>`,
      `${!isNew ? `<button class="btn danger ghost" id="rDel">${icon('trash')} Delete</button><button class="btn" id="rPrint">${icon('print')} Print</button>` : ''}<span class="sp"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="rSave">Save</button>`);
    const f = $('#rForm', m);
    const showBal = () => { const id = f[pk].value; $('#pBal').innerHTML = id ? `Current balance ${S ? 'receivable from' : 'payable to'} <b>${U.esc(partyName(PT, id))}</b>: <b>${U.money(R.partyBal(PT, id))}</b>` : ''; };
    f[pk].onchange = showBal; showBal();
    $('#rSave', m).onclick = () => {
      const v = readForm(f);
      if (!v[pk] || !v.date || !v.accountId) return toast('Fill in the required fields', 'err');
      v.amount = U.num(v.amount); v.wht = U.num(v.wht);
      if (v.amount <= 0) return toast('Amount must be greater than zero', 'err');
      if (isLocked(v.date) || (rec.date && rec.no && isLocked(rec.date))) return toast(lockMsg(), 'err');
      Object.assign(rec, v); if (!rec.no) rec.no = DB.nextNo(S ? 'RV' : 'PV');
      DB.upsert(key, rec); closeModal(); toast(singular + ' ' + rec.no + ' saved'); render();
    };
    if (!isNew) {
      $('#rDel', m).onclick = () => isLocked(rec.date) ? toast(lockMsg(), 'err') : confirmBox(`Delete ${singular.toLowerCase()} ${rec.no}?`, () => { DB.remove(key, rec.id); render(); });
      $('#rPrint', m).onclick = () => { $('#printArea').innerHTML = printMoney(rec); closeModal(); window.print(); };
    }
  };
  const printMoney = d => `<div class="print-doc">${printHeader(S ? 'Payment Receipt' : 'Payment Voucher', `<b>${U.esc(d.no)}</b><br>Date: ${U.fdate(d.date)}`)}
    <table class="tbl"><tbody><tr><th>${S ? 'Received from' : 'Paid to'}</th><td>${U.esc(partyName(PT, d[pk]))}</td></tr><tr><th>${S ? 'Received in' : 'Paid from'}</th><td>${U.esc(acc(d.accountId)?.name)}</td></tr>
    <tr><th>Cheque / ref</th><td>${U.esc(d.ref || '')}</td></tr><tr><th>Narration</th><td>${U.esc(d.memo || '')}</td></tr>${U.num(d.wht) ? `<tr><th>Tax withheld</th><td>${U.money(d.wht)}</td></tr>` : ''}
    <tr><th>Amount</th><td><b>${DB.data.settings.currency} ${U.money(d.amount)}</b></td></tr></tbody></table><div class="signs"><div>Prepared by</div><div>Approved by</div><div>${S ? 'Received' : 'Paid'} by</div></div></div>`;
  return { render, edit, title, singular };
}

const jvTotals = doc => ({ dr: U.r2(U.sum(doc.lines, l => U.num(l.debit))), cr: U.r2(U.sum(doc.lines, l => U.num(l.credit))) });
const journalCfg = {

  beforeSave: doc => doc.lines.forEach(l => { l.debit = U.num(l.debit); l.credit = U.num(l.credit); setPartyType(l); }),
  print: d => `<div class="print-doc">${printHeader('Journal Voucher', `<b>${U.esc(d.no)}</b><br>Date: ${U.fdate(d.date)}${d.ref ? '<br>Ref: ' + U.esc(d.ref) : ''}`)}${d.memo ? `<p>${U.esc(d.memo)}</p>` : ''}

    <tfoot><tr><td colspan="3"><b>Total</b></td><td class="num"><b>${U.money(jvTotals(d).dr)}</b></td><td class="num"><b>${U.money(jvTotals(d).cr)}</b></td></tr></tfoot></table><div class="signs"><div>Prepared by</div><div>Checked by</div><div>Approved by</div></div></div>`,
};
route('/journals', () => docList({ key: 'journals', path: 'journals', title: 'Journals', singular: 'Journal', totalOf: d => jvTotals(d).dr,

<script>

/* =========================================================

const stockItemOpts2 = sel => opts(DB.data.items.filter(i => i.type !== 'Service').sort((a, b) => a.name.localeCompare(b.name)).map(i => [i.id, `${i.code ? i.code + ' · ' : ''}${i.name}`]), sel);

simpleList('consumptions', 'consumptions', 'Inventory Consumption', 'Consumption', [C_NO, C_DATE, { label: 'Location', get: d => wh(d.warehouseId)?.name }, { label: 'Charged to', get: d => acc(d.accountId)?.name }, { label: 'Purpose', get: d => d.memo }]);

/* ---------- Demand / Issue to location / Receipt in location ---------- */
const issuedFor = id => DB.data.issues.filter(i => i.fromId === id);
const receivedFor = id => DB.data.locReceipts.filter(r => r.issueId === id);
function pendingOfIssue(iss) {
  const rec = {}; receivedFor(iss.id).forEach(r => r.lines.forEach(l => { rec[l.itemId] = (rec[l.itemId] || 0) + U.num(l.qty); }));
  return iss.lines.map(l => ({ itemId: l.itemId, issued: U.num(l.qty), pending: Math.max(0, U.num(l.qty) - (rec[l.itemId] || 0)) }));
}
const issueStatus = iss => { const p = pendingOfIssue(iss), pend = U.sum(p, x => x.pending), tot = U.sum(p, x => x.issued); return pend <= 1e-9 ? 'Received' : pend < tot ? 'Partly received' : 'In transit'; };

const demandCfg = {
  key: 'demands', path: 'demands', title: 'Demand', singular: 'Demand', prefix: 'DEM',
  blank: () => ({ date: U.today(), toWarehouseId: DB.data.warehouses[1]?.id || DB.data.warehouses[0]?.id, fromWarehouseId: DB.data.warehouses[0]?.id, lines: [] }),
  newLine: () => ({ itemId: '', qty: '' }), keepLine: l => l.itemId && U.num(l.qty) > 0,

  onHeadChange: () => {}, cols: qtyCols('fromWarehouseId', 'Available at supplier location'), totals: qtyTotal,
  validate: d => !d.toWarehouseId ? 'Choose the demanding location' : !d.lines.length ? 'Add at least one item' : null, beforeSave: numLines,
  extraButtons: d => `<a class="btn" href="#/issues/new?demand=${d.id}">→ Issue to location</a>`,
};
simpleList('demands', 'demands', 'Demand', 'Demand', [C_NO, C_DATE, { label: 'Demanding location', get: d => wh(d.toWarehouseId)?.name }, { label: 'Supply from', get: d => wh(d.fromWarehouseId)?.name }, { label: 'Status', html: d => badge(issuedFor(d.id).length ? 'Issued' : 'Open') }]);
route('/demands/:id', id => docEditor(demandCfg, id));

const issueCfg = {
  key: 'issues', path: 'issues', title: 'Issue to Location', singular: 'Issue to Location', prefix: 'ITL',
  blank: qs => {
    const d = { date: U.today(), fromWarehouseId: DB.data.warehouses[0]?.id, toWarehouseId: DB.data.warehouses[1]?.id || '', lines: [] };
    const dem = qs.demand && DB.get('demands', qs.demand);
    if (dem) Object.assign(d, { fromId: dem.id, fromNo: dem.no, fromWarehouseId: dem.fromWarehouseId || d.fromWarehouseId, toWarehouseId: dem.toWarehouseId, lines: JSON.parse(JSON.stringify(dem.lines)) });
    return d;
  },
  newLine: () => ({ itemId: '', qty: '' }), keepLine: l => l.itemId && U.num(l.qty) > 0,
  head: [{ name: 'date', label: 'Date', type: 'date', required: true }, { name: 'fromWarehouseId', label: 'From location', type: 'select', options: v => whOpts(v, '— Select —') },
    { name: 'toWarehouseId', label: 'To location', type: 'select', options: v => whOpts(v, '— Select —') }, { name: 'vehicle', label: 'Vehicle / driver' }, { name: 'memo', label: 'Narration' }],
  banner: d => d.fromNo ? `<div class="info">Against demand <b>${U.esc(d.fromNo)}</b>. Goods stay <b>in transit</b> until a Receipt in Location is recorded.</div>` : '<div class="info">Issued goods stay <b>in transit</b> until a Receipt in Location is recorded at the destination.</div>',

  beforeSave: numLines,

};
simpleList('issues', 'issues', 'Issue to Location', 'Issue to Location', [C_NO, C_DATE, { label: 'From', get: d => wh(d.fromWarehouseId)?.name }, { label: 'To', get: d => wh(d.toWarehouseId)?.name }, { label: 'Status', html: d => badge(issueStatus(d)) }]);
route('/issues/:id', (id, qs) => docEditor(issueCfg, id, qs));

const lrCfg = {
  key: 'locReceipts', path: 'loc-receipts', title: 'Receipt in Location', singular: 'Receipt in Location', prefix: 'RIL',
  blank: qs => { const d = { date: U.today(), lines: [] }; if (qs.issue) fillFromIssue(d, qs.issue); return d; },
  newLine: () => ({ itemId: '', qty: '' }), keepLine: l => l.itemId && U.num(l.qty) > 0,
  head: [{ name: 'date', label: 'Date', type: 'date', required: true },
    { name: 'issueId', label: 'Against issue', type: 'select', required: true, options: v => opts(DB.data.issues.filter(i => i.id === v || issueStatus(i) !== 'Received').map(i => [i.id, `${i.no} · ${wh(i.fromWarehouseId)?.name} → ${wh(i.toWarehouseId)?.name}`]), v) },
    { name: 'memo', label: 'Narration' }],
  onHeadChange: (doc, name) => { if (name === 'issueId') fillFromIssue(doc, doc.issueId); },
  cols: [
    { name: 'itemId', label: 'Item', type: 'select', cls: 'w-item', options: l => stockItemOpts2(l.itemId) },
    { name: 'pend', label: 'Pending in transit', type: 'calc', calc: (l, d) => { const iss = DB.get('issues', d.issueId); const p = iss && pendingOfIssue(iss).find(x => x.itemId === l.itemId); return p ? U.qty(p.pending + (DB.get('locReceipts', d.id || '-')?.lines.find(x => x.itemId === l.itemId)?.qty || 0)) : ''; } },
    { name: 'qty', label: 'Received qty', type: 'number', cls: 'w-num' },
  ],
  totals: d => `<div class="tr"><span>Destination</span><b>${U.esc(wh(d.toWarehouseId)?.name || '—')}</b></div>` + qtyTotal(d),
  validate: d => {
    const iss = DB.get('issues', d.issueId); if (!iss) return 'Choose the issue being received';
    if (!d.lines.length) return 'Enter received quantities';
    const pend = pendingOfIssue(iss), own = DB.get('locReceipts', d.id || '-');
    for (const l of d.lines) { const p = pend.find(x => x.itemId === l.itemId); const allowed = (p?.pending || 0) + (own?.lines.find(x => x.itemId === l.itemId)?.qty || 0); if (U.num(l.qty) > allowed + 1e-9) return `Received quantity for ${item(l.itemId)?.name} is more than pending`; }
    if (d.date < iss.date) return 'Receipt date cannot be before the issue date';
    return null;
  },
  beforeSave: d => { numLines(d); d.toWarehouseId = DB.get('issues', d.issueId).toWarehouseId; },
};
function fillFromIssue(d, id) { const iss = DB.get('issues', id); if (!iss) return; d.issueId = id; d.toWarehouseId = iss.toWarehouseId; d.lines = pendingOfIssue(iss).filter(p => p.pending > 0).map(p => ({ itemId: p.itemId, qty: p.pending })); }
simpleList('locReceipts', 'loc-receipts', 'Receipt in Location', 'Receipt in Location', [C_NO, C_DATE, { label: 'Issue', get: d => DB.get('issues', d.issueId)?.no }, { label: 'Received at', get: d => wh(d.toWarehouseId)?.name }, { label: 'Quantity', cls: 'num', get: d => U.qty(U.sum(d.lines, l => U.num(l.qty))) }]);
route('/loc-receipts/:id', (id, qs) => docEditor(lrCfg, id, qs));

  cols: [{ name: 'accountId', label: 'Expense account', type: 'select', cls: 'w-item', options: l => accOpts(l.accountId, leafAccounts().filter(a => a.type === 'Expense' || (a.type === 'Asset' && !a.cashBank))) },
    { name: 'memo', label: 'Description', cls: 'w-desc' }, { name: 'amount', label: 'Amount', type: 'number', cls: 'w-num' }],

    <div class="quick">${sel ? `<a class="btn" href="#/vouchers/new?kind=Receipt&acc=${sel}">${icon('plus')} Money in</a><a class="btn" href="#/vouchers/new?kind=Payment&acc=${sel}">${icon('plus')} Money out</a>` : ''}<button class="btn" id="ftNew">${icon('plus')} Transfer funds</button><a class="btn" href="#/reports/general-ledger?account=${sel || ''}">Full ledger</a></div>
    <div class="card"><div class="card-h pad-x"><h3>Recent transactions · ${U.esc(acc(sel)?.name || '')}</h3></div>
    ${table([C_DATE, { label: 'Number', html: l => `<b>${U.esc(l.no)}</b>` }, { label: 'Type', get: l => l.type }, { label: 'Details', get: l => l.memo }, { label: 'Deposit', cls: 'num', get: l => U.money(l.debit, true) }, { label: 'Withdrawal', cls: 'num', get: l => U.money(l.credit, true) }], ls, { rowAttr: l => `data-href="${l.route}" class="clickable"`, empty: 'No transactions on this account yet.' })}</div>
    <div class="card"><div class="card-h pad-x"><h3>Fund transfers</h3></div><div id="ftList"></div></div>`,
    `<button class="btn primary" id="baNew">${icon('plus')} Add bank / cash account</button>`);
  bindRowLinks();
  const renderFt = () => { $('#ftList').innerHTML = table([C_NO, C_DATE, { label: 'From', get: d => acc(d.fromAccountId)?.name }, { label: 'To', get: d => acc(d.toAccountId)?.name }, { label: 'Charges', cls: 'num', get: d => U.money(d.charges, true) }, { label: 'Amount', cls: 'num', get: d => U.money(d.amount) }],
    DB.data.fundTransfers.slice().sort((a, b) => b.date.localeCompare(a.date)), { rowAttr: d => `data-ft="${d.id}" class="clickable"`, empty: 'No transfers yet.' }); $$('[data-ft]').forEach(tr => tr.onclick = () => ft(DB.get('fundTransfers', tr.dataset.ft))); };
  const ft = rec => {
    const isNew = !rec; rec = rec ? Object.assign({}, rec) : { date: U.today(), fromAccountId: accs[0]?.id, toAccountId: accs[1]?.id };
    const m = modal(isNew ? 'Transfer funds' : 'Fund transfer ' + rec.no, `<form id="ftF" class="grid2">
      ${field({ name: 'date', label: 'Date', type: 'date', required: true }, rec.date)}${field({ name: 'amount', label: 'Amount', type: 'number', required: true }, rec.amount)}
      ${field({ name: 'fromAccountId', label: 'From account', type: 'select', options: v => accOpts(v, accs) }, rec.fromAccountId)}${field({ name: 'toAccountId', label: 'To account', type: 'select', options: v => accOpts(v, accs) }, rec.toAccountId)}
      ${field({ name: 'charges', label: 'Bank charges', type: 'number' }, rec.charges)}${field({ name: 'ref', label: 'Cheque / reference' }, rec.ref)}${field({ name: 'memo', label: 'Narration', wide: true }, rec.memo)}</form>`,
      `${!isNew ? `<button class="btn danger ghost" id="ftDel">${icon('trash')} Delete</button>` : ''}<span class="sp"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="ftSave">Save</button>`);
    $('#ftSave', m).onclick = () => {
      const v = readForm($('#ftF')); v.amount = U.num(v.amount); v.charges = U.num(v.charges);
      if (!v.fromAccountId || !v.toAccountId || v.fromAccountId === v.toAccountId) return toast('Choose two different accounts', 'err');
      if (v.amount <= 0) return toast('Enter the amount', 'err');
      if (isLocked(v.date) || (!isNew && isLocked(rec.date))) return toast(lockMsg(), 'err');
      Object.assign(rec, v); if (!rec.no) rec.no = DB.nextNo('FT'); DB.upsert('fundTransfers', rec); closeModal(); toast('Transfer saved'); go(location.hash);
    };
    if (!isNew) $('#ftDel', m).onclick = () => isLocked(rec.date) ? toast(lockMsg(), 'err') : confirmBox('Delete this transfer?', () => { DB.remove('fundTransfers', rec.id); go(location.hash); });
  };
  $('#ftNew').onclick = () => ft();
  $('#baNew').onclick = () => {
    const m = modal('Add bank / cash account', `<form id="baF" class="grid2">${field({ name: 'kind', label: 'Type', type: 'select', options: v => opts([['Bank', 'Bank account'], ['Cash', 'Cash / petty cash']], v, null) }, 'Bank')}
      ${field({ name: 'name', label: 'Account name', required: true, placeholder: 'e.g. Meezan Bank – Current' }, '')}${field({ name: 'bankName', label: 'Bank name' }, '')}${field({ name: 'accountNo', label: 'Account no. / IBAN' }, '')}
      ${field({ name: 'opening', label: 'Opening balance', type: 'number' }, '')}</form>`, `<span class="sp"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="baSave">Save</button>`);
    $('#baSave', m).onclick = () => {
      const v = readForm($('#baF')); if (!v.name) return toast('Enter the account name', 'err');
      const sib = DB.data.accounts.filter(a => a.parentId === 'g11').map(a => +a.code).filter(Number.isFinite);
      DB.upsert('accounts', { code: String(Math.max(1100, ...sib) + 1), name: v.name, type: 'Asset', parentId: 'g11', isGroup: false, cashBank: true, bankName: v.bankName, accountNo: v.accountNo, opening: U.num(v.opening) });
      closeModal(); toast('Account added'); go('#/cash-banks');
    };
  };
  renderFt();
});

const bomCost = b => U.sum(b.lines || [], l => { const s = R.stock()[l.itemId]; const c = s && s.qty > 0 ? s.value / s.qty : U.num(item(l.itemId)?.costPrice); return U.num(l.qty) * c; }) + U.num(b.overhead);
route('/boms', () => {
  const render = () => { $('#bomList').innerHTML = table([{ label: 'Code', get: b => b.code }, { label: 'Finished item', html: b => `<b>${U.esc(item(b.itemId)?.name || '')}</b>` }, { label: 'Components', get: b => b.lines.length }, { label: 'Overhead / unit', cls: 'num', get: b => U.money(b.overhead, true) }, { label: 'Cost per unit', cls: 'num', get: b => U.money(bomCost(b)) }, { label: '', html: b => `<button class="btn sm" data-prod="${b.id}">Produce</button>` }],
    DB.data.boms, { rowAttr: b => `data-id="${b.id}" class="clickable"`, empty: 'No bills of materials yet.' });
    $$('#bomList tr[data-id]').forEach(tr => tr.onclick = e => { if (e.target.dataset.prod) return produce(DB.get('boms', e.target.dataset.prod)); edit(DB.get('boms', tr.dataset.id)); });
    $('#asmList').innerHTML = table([C_NO, C_DATE, { label: 'Item produced', get: d => item(DB.get('boms', d.bomId)?.itemId)?.name }, { label: 'Location', get: d => wh(d.warehouseId)?.name }, { label: 'Quantity', cls: 'num', get: d => U.qty(d.qty) }, { label: '', html: d => `<button class="btn sm danger ghost" data-del="${d.id}">Delete</button>` }],
      DB.data.assemblies.slice().sort((a, b) => b.date.localeCompare(a.date)), { empty: 'No production recorded.' });
    $$('#asmList [data-del]').forEach(b => b.onclick = () => { const d = DB.get('assemblies', b.dataset.del); if (isLocked(d.date)) return toast(lockMsg(), 'err'); confirmBox('Delete this production entry?', () => { DB.remove('assemblies', d.id); render(); }); });
  };
  const edit = rec => {
    const isNew = !rec; const b = rec ? JSON.parse(JSON.stringify(rec)) : { lines: [{ itemId: '', qty: '' }] };
    const lineHtml = () => b.lines.map((l, i) => `<tr data-i="${i}"><td><select data-k="itemId">${stockItemOpts2(l.itemId)}</select></td><td><input data-k="qty" type="number" step="any" value="${U.esc(l.qty)}"></td><td><button class="icon-btn" data-rm="${i}">${icon('x')}</button></td></tr>`).join('');
    const m = modal(isNew ? 'New bill of materials' : 'Edit BOM', `<form id="bF" class="grid2">${field({ name: 'itemId', label: 'Finished item', type: 'select', required: true, options: v => stockItemOpts2(v) }, b.itemId)}${field({ name: 'code', label: 'BOM code', placeholder: 'Auto' }, b.code)}
      ${field({ name: 'overhead', label: 'Labour / overhead per unit', type: 'number' }, b.overhead)}${field({ name: 'overheadAccountId', label: 'Overhead absorbed from', type: 'select', options: v => accOpts(v || L().purchaseExpense, leafAccounts().filter(a => a.type === 'Expense')) }, b.overheadAccountId)}</form>
      <h3 class="mt">Components per 1 unit</h3><table class="tbl lines"><thead><tr><th>Component item</th><th>Quantity</th><th></th></tr></thead><tbody id="bL"></tbody></table><button class="btn ghost sm" id="bAdd">${icon('plus')} Add component</button>`,
      `${!isNew ? `<button class="btn danger ghost" id="bDel">${icon('trash')} Delete</button>` : ''}<span class="sp"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="bSave">Save</button>`, true);
    const draw = () => { $('#bL').innerHTML = lineHtml(); $$('#bL [data-k]').forEach(el => el.oninput = el.onchange = () => { b.lines[+el.closest('tr').dataset.i][el.dataset.k] = el.value; }); $$('#bL [data-rm]').forEach(x => x.onclick = () => { b.lines.splice(+x.dataset.rm, 1); draw(); }); };
    draw(); $('#bAdd').onclick = () => { b.lines.push({ itemId: '', qty: '' }); draw(); };
    $('#bSave', m).onclick = () => {
      Object.assign(b, readForm($('#bF'))); b.overhead = U.num(b.overhead); b.lines = b.lines.filter(l => l.itemId && U.num(l.qty) > 0).map(l => ({ itemId: l.itemId, qty: U.num(l.qty) }));
      if (!b.itemId || !b.lines.length) return toast('Choose the finished item and at least one component', 'err');
      if (b.lines.some(l => l.itemId === b.itemId)) return toast('An item cannot be a component of itself', 'err');
      if (!b.code) b.code = autoCode('boms', 'BOM-'); DB.upsert('boms', b); closeModal(); toast('BOM saved'); render();
    };
    if (!isNew) $('#bDel', m).onclick = () => DB.data.assemblies.some(a => a.bomId === b.id) ? toast('This BOM has production entries', 'err') : confirmBox('Delete this BOM?', () => { DB.remove('boms', b.id); render(); });
  };
  const produce = b => {
    const m = modal('Produce ' + (item(b.itemId)?.name || ''), `<form id="pF" class="grid2">${field({ name: 'date', label: 'Date', type: 'date', required: true }, U.today())}${field({ name: 'qty', label: 'Quantity to produce', type: 'number', required: true }, 1)}${field({ name: 'warehouseId', label: 'Location', type: 'select', options: v => whOpts(v) }, DB.data.warehouses[0]?.id)}</form>
      <div class="info">Components are issued from stock at average cost; the finished item is received at that cost plus overhead (${U.money(bomCost(b))} per unit at today's costs).</div>`,
      `<span class="sp"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="pSave">Record production</button>`);
    $('#pSave', m).onclick = () => { const v = readForm($('#pF')); v.qty = U.num(v.qty); if (v.qty <= 0) return toast('Enter a quantity', 'err'); if (isLocked(v.date)) return toast(lockMsg(), 'err');
      DB.upsert('assemblies', Object.assign(v, { bomId: b.id, no: DB.nextNo('PRD') })); closeModal(); toast('Production recorded'); render(); };
  };
  page('Bill of Materials (BOM)', `<div class="card"><div id="bomList"></div></div><h3 class="sec">Production entries</h3><div class="card"><div id="asmList"></div></div>`, `<button class="btn primary" id="bNew">${icon('plus')} New BOM</button>`);
  $('#bNew').onclick = () => edit(); render();
});

/* ---------- Recurring profiles ---------- */
route('/recurring/:kind', kind => {
  const [key] = REC_KEYS[kind] || []; if (!key) return go('#/dashboard');
  const names = { invoice: ['Recurring Invoices', 'invoice', 'invoices'], bill: ['Recurring Bills', 'bill', 'bills'], expense: ['Recurring Expenses', 'expense', 'expenses'], journal: ['Recurring Journals', 'journal', 'journals'] }[kind];
  const label = d => `${d.no} · ${U.fdate(d.date)}${d.customerId ? ' · ' + partyName('C', d.customerId) : d.supplierId ? ' · ' + partyName('S', d.supplierId) : d.memo ? ' · ' + d.memo : ''}`;
  const render = () => { $('#rcList').innerHTML = table([{ label: 'Profile', html: r => `<b>${U.esc(r.name)}</b>` }, { label: 'Template', get: r => DB.get(key, r.templateId)?.no || '(deleted)' }, { label: 'Repeats', get: r => FREQ[r.freq][0] }, { label: 'Next date', get: r => U.fdate(r.next) }, { label: 'Ends', get: r => r.end ? U.fdate(r.end) : 'Never' }, { label: 'Created', cls: 'num', get: r => r.count || 0 }, { label: 'Status', html: r => badge(r.paused ? 'Paused' : (r.end && r.next > r.end ? 'Expired' : 'Active')) }],
    DB.data.recurring.filter(r => r.kind === kind), { rowAttr: r => `data-id="${r.id}" class="clickable"`, empty: `No recurring ${names[1]}s yet. Create a normal ${names[1]} first, then make it recurring here.` }); $$('#rcList [data-id]').forEach(tr => tr.onclick = () => edit(DB.get('recurring', tr.dataset.id))); };
  const edit = rec => {
    const isNew = !rec; rec = rec ? Object.assign({}, rec) : { kind, freq: 'monthly', start: addMonths(U.today(), 1) };
    const docs = DB.data[key].filter(d => !d.recurringId).sort((a, b) => b.date.localeCompare(a.date));
    const m = modal(isNew ? 'New recurring profile' : 'Edit recurring profile', `<form id="rcF" class="grid2">${field({ name: 'name', label: 'Profile name', required: true }, rec.name)}
      ${field({ name: 'templateId', label: `Copy this ${names[1]} each time`, type: 'select', options: v => opts(docs.map(d => [d.id, label(d)]), v) }, rec.templateId)}
      ${field({ name: 'freq', label: 'Repeat every', type: 'select', options: v => opts(Object.entries(FREQ).map(([k, f]) => [k, f[0]]), v, null) }, rec.freq)}
      ${field({ name: 'start', label: isNew ? 'First date' : 'Next date', type: 'date', required: true }, isNew ? rec.start : rec.next)}
      ${field({ name: 'end', label: 'End date (optional)', type: 'date' }, rec.end)}${field({ name: 'paused', label: 'Paused', type: 'checkbox' }, rec.paused)}</form>
      <div class="info">New ${names[1]}s are created automatically when the ERP is opened on or after each date.</div>`,
      `${!isNew ? `<button class="btn danger ghost" id="rcDel">${icon('trash')} Delete</button>` : ''}<span class="sp"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="rcSave">Save</button>`);
    $('#rcSave', m).onclick = () => { const v = readForm($('#rcF')); if (!v.name || !v.templateId || !v.start) return toast('Fill in name, template and date', 'err');
      Object.assign(rec, { name: v.name, templateId: v.templateId, freq: v.freq, next: v.start, end: v.end, paused: v.paused }); DB.upsert('recurring', rec); const n = runRecurring(); closeModal(); toast(n ? `Profile saved · ${n} ${names[1]}(s) created` : 'Profile saved'); render(); };
    if (!isNew) $('#rcDel', m).onclick = () => confirmBox('Delete this profile? Documents already created stay.', () => { DB.remove('recurring', rec.id); render(); });
  };
  page(names[0], `<div class="card"><div id="rcList"></div></div>`, `<a class="btn" href="#/${names[2]}">All ${names[1]}s</a><button class="btn primary" id="rcNew">${icon('plus')} New profile</button>`);
  $('#rcNew').onclick = () => edit(); render();
});

/* ---------- Transaction locking ---------- */
route('/locking', () => {
  const s = DB.data.settings;
  page('Transaction Locking', `<div class="card pad"><p class="muted">Lock the books up to a date so that no transaction on or before it can be added, edited or deleted — for example after closing a month or filing a return.</p>
    <form id="lkF" class="grid2">${field({ name: 'lockDate', label: 'Lock transactions up to and including', type: 'date' }, s.lockDate)}${field({ name: 'lockNote', label: 'Reason' }, s.lockNote)}</form>
    <div class="info">${s.lockDate ? `Currently locked up to <b>${U.fdate(s.lockDate)}</b>.` : 'No lock is set — every period is open.'}</div>
    <div class="form-foot">${s.lockDate ? '<button class="btn" id="lkOff">Unlock all</button>' : ''}<button class="btn primary" id="lkSave">Save lock</button></div></div>`);
  $('#lkSave').onclick = () => { Object.assign(s, readForm($('#lkF'))); DB.save(); toast(s.lockDate ? 'Locked up to ' + U.fdate(s.lockDate) : 'Lock removed'); go('#/locking'); };
  if ($('#lkOff')) $('#lkOff').onclick = () => { s.lockDate = ''; DB.save(); toast('All periods unlocked'); go('#/locking'); };
});

/* ---------- Budget ---------- */
const fyMonths = fy => Array.from({ length: 12 }, (_, i) => addMonths(fy, i).slice(0, 7));
route('/budget', () => {
  const s = DB.data.settings;
  const qy = new URLSearchParams(location.hash.split('?')[1] || '').get('fy') || U.fyStart(U.today(), s.fyStartMonth);
  const months = fyMonths(qy), mName = m => ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m.slice(5) - 1];
  const accs = leafAccounts().filter(a => a.type === 'Income' || a.type === 'Expense');
  const getB = id => DB.data.budgets.find(b => b.fy === qy && b.accountId === id);
  const years = [-1, 0, 1].map(n => addMonths(U.fyStart(U.today(), s.fyStartMonth), 12 * n));
  page('Budget', `<div class="card"><div class="toolbar"><label class="inl">Financial year <select id="bgFy">${opts(years.map(y => [y, `${y.slice(0, 4)}-${String(+y.slice(0, 4) + 1).slice(2)}`]), qy, null)}</select></label><span class="muted sm">Enter monthly amounts. Use the Annual column to spread a yearly figure evenly.</span></div>
    <div class="tbl-wrap"><table class="tbl budget"><thead><tr><th>Account</th><th class="num">Annual</th>${months.map(m => `<th class="num">${mName(m)}</th>`).join('')}</tr></thead><tbody>
    ${accs.map(a => { const b = getB(a.id); const v = b ? b.months : Array(12).fill(''); return `<tr data-a="${a.id}"><td>${U.esc(a.code)} · ${U.esc(a.name)} <span class="muted sm">${a.type}</span></td><td><input class="mini w" data-annual type="number" step="any" value="${b ? U.r2(U.sum(v, x => U.num(x))) || '' : ''}"></td>${v.map((x, i) => `<td><input class="mini" data-m="${i}" type="number" step="any" value="${U.esc(x)}"></td>`).join('')}</tr>`; }).join('')}
    </tbody></table></div><div class="form-foot pad-x" style="padding-bottom:16px"><a class="btn" href="#/reports/budget-actual?fy=${qy}">Budget vs actual</a><button class="btn primary" id="bgSave">Save budget</button></div></div>`);
  $('#bgFy').onchange = e => go('#/budget?fy=' + e.target.value);
  $$('[data-annual]').forEach(inp => inp.onchange = () => { const per = U.r2(U.num(inp.value) / 12); $$('[data-m]', inp.closest('tr')).forEach(x => { x.value = per || ''; }); });
  $('#bgSave').onclick = () => {
    DB.data.budgets = DB.data.budgets.filter(b => b.fy !== qy);
    $$('tr[data-a]').forEach(tr => { const m = $$('[data-m]', tr).map(x => U.num(x.value)); if (m.some(Boolean)) DB.data.budgets.push({ id: U.uid(), fy: qy, accountId: tr.dataset.a, months: m }); });
    DB.save(); toast('Budget saved');
  };
});

</script>
<script>
'use strict';
/* =========================================================
   Dashboard & reports
   ========================================================= */

route('/dashboard', () => {
  const s = DB.data.settings, K = L(), today = U.today();
  const fy = U.fyStart(today, s.fyStartMonth), ms = U.monthStart(today);
  const cash = R.bal(cashBankAccounts().map(a => a.id));
  const ar = R.bal([K.ar]), ap = -R.bal([K.ap]);
  const stockVal = U.sum(Object.values(R.stock()), x => x.value);
  const salesIds = DB.data.accounts.filter(a => a.type === 'Income' && !a.isGroup).map(a => a.id);
  const salesM = -R.bal(salesIds, { from: ms, to: today });
  const profitFY = R.profit({ from: fy, to: today });
  // last 6 months sales vs purchases
  const months = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(today + 'T00:00:00Z'); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() - i); months.push(d.toISOString().slice(0, 7)); }
  const inMonth = (arr, m) => U.sum(arr.filter(d => d.date.startsWith(m)), d => calcDoc(d).net);
  const series = months.map(m => ({ m, s: inMonth(DB.data.invoices, m), p: inMonth(DB.data.bills, m) }));
  const max = Math.max(1, ...series.map(x => Math.max(x.s, x.p)));
  const mLabel = m => ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m.slice(5) - 1];
  const W = 560, H = 200, bw = 26, gap = W / 6;
  const bars = series.map((x, i) => {
    const hs = x.s / max * (H - 30), hp = x.p / max * (H - 30), cx = i * gap + gap / 2;
    return `<g><rect x="${cx - bw - 2}" y="${H - 20 - hs}" width="${bw}" height="${hs}" rx="3" class="bar-s"><title>Sales ${mLabel(x.m)}: ${U.money(x.s)}</title></rect>
      <rect x="${cx + 2}" y="${H - 20 - hp}" width="${bw}" height="${hp}" rx="3" class="bar-p"><title>Purchases ${mLabel(x.m)}: ${U.money(x.p)}</title></rect>
      <text x="${cx}" y="${H - 4}" text-anchor="middle" class="axis">${mLabel(x.m)}</text></g>`;
  }).join('');
  const recent = Ledger.get().lines.filter(l => l.type !== 'Opening' && l.type !== 'Opening Stock');
  const seen = new Set(), docs = [];
  for (let i = recent.length - 1; i >= 0 && docs.length < 8; i--) { const l = recent[i]; if (seen.has(l.docId)) continue; seen.add(l.docId); docs.push(recent.find(x => x.docId === l.docId)); }
  docs.sort((a, b) => b.date.localeCompare(a.date));
  const docAmt = id => {
    const d = DB.data;
    let x = d.invoices.find(z => z.id === id) || d.bills.find(z => z.id === id); if (x) return calcDoc(x).total;
    x = d.receipts.find(z => z.id === id) || d.payments.find(z => z.id === id); if (x) return U.num(x.amount);
    x = d.vouchers.find(z => z.id === id); if (x) return U.sum(x.lines, l => U.num(l.amount));
    return U.sum(Ledger.get().lines.filter(l => l.docId === id), l => l.debit);
  };
  const st = R.stock();
  const low = DB.data.items.filter(i => i.type !== 'Service' && U.num(i.reorder) && (st[i.id]?.qty || 0) <= U.num(i.reorder));
  const kpi = (label, v, href, cls = '') => `<a class="kpi ${cls}" href="${href}"><span>${label}</span><b>${U.money(v)}</b></a>`;
  const empty = !DB.data.customers.length && !DB.data.items.length && !DB.data.invoices.length;
  page('Dashboard', `
    ${empty ? `<div class="card pad welcome"><h3>Welcome to ${U.esc(APP.name)}</h3><p>Your ERP is empty and ready. A good order to set up:</p>
      <ol><li><a href="#/settings/company">Company profile</a> — name, NTN, opening date</li><li><a href="#/accounts">Chart of accounts</a> — review accounts and enter opening balances</li><li><a href="#/items">Items</a>, <a href="#/customers">customers</a> and <a href="#/suppliers">suppliers</a></li><li>Start recording <a href="#/bills/new">purchase bills</a> and <a href="#/invoices/new">sales invoices</a></li></ol></div>` : ''}
    <div class="kpis">
      ${kpi('Cash & bank', cash, '#/reports/general-ledger?account=' + (cashBankAccounts()[0]?.id || ''))}
      ${kpi('Receivables', ar, '#/reports/receivables-aging')}
      ${kpi('Payables', ap, '#/reports/payables-aging')}
      ${kpi('Stock value', stockVal, '#/reports/stock-summary')}
      ${kpi('Income this month', salesM, '#/reports/profit-loss?from=' + ms)}
      ${kpi('Net profit this year', profitFY, '#/reports/profit-loss?from=' + fy, profitFY < 0 ? 'neg' : 'pos')}
    </div>
    <div class="quick">
      <a class="btn" href="#/invoices/new">${icon('plus')} Sales invoice</a><a class="btn" href="#/receipts?new=">${icon('plus')} Receipt</a>
      <a class="btn" href="#/bills/new">${icon('plus')} Purchase bill</a><a class="btn" href="#/payments?new=">${icon('plus')} Payment</a>
      <a class="btn" href="#/vouchers/new">${icon('plus')} Cash/bank voucher</a><a class="btn" href="#/journals/new">${icon('plus')} Journal</a>
    </div>
    <div class="grid-2">
      <div class="card pad"><div class="card-h"><h3>Sales vs purchases</h3><span class="legend"><i class="lg-s"></i>Sales <i class="lg-p"></i>Purchases</span></div>
        <svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Monthly sales and purchases"><line x1="0" x2="${W}" y1="${H - 20}" y2="${H - 20}" class="base"/>${bars}</svg></div>
      <div class="card pad"><div class="card-h"><h3>Low stock</h3><a class="lnk" href="#/reports/stock-summary">Stock report</a></div>
        ${low.length ? table([{ label: 'Item', get: i => i.name }, { label: 'On hand', cls: 'num', get: i => U.qty(st[i.id]?.qty || 0) }, { label: 'Re-order at', cls: 'num', get: i => U.qty(i.reorder) }], low.slice(0, 8)) : '<div class="empty">No items below their re-order level.</div>'}</div>
    </div>
    <div class="card"><div class="card-h pad-x"><h3>Recent transactions</h3><a class="lnk" href="#/reports/day-book">Day book</a></div>
      ${table([{ label: 'Date', get: l => U.fdate(l.date) }, { label: 'Number', html: l => `<b>${U.esc(l.no)}</b>` }, { label: 'Type', get: l => l.type }, { label: 'Details', get: l => l.memo }, { label: 'Amount', cls: 'num', get: l => U.money(docAmt(l.docId)) }], docs, { rowAttr: l => `data-href="${l.route}" class="clickable"`, empty: 'No transactions yet.' })}</div>`);
  bindRowLinks();
});

/* ---------------- report framework ---------------- */
const REPORTS = [
  ['Sales & Estimate', 'Revenue by customer, item and salesman', [['sales-by-customer', 'Sales By Customer'], ['item-sales', 'Sales By Item'], ['sales-by-salesman', 'Sales By Salesman'], ['estimate-details', 'Estimate Details'], ['sales-return-details', 'Sales Return Details'], ['sales-register', 'Invoice Details']]],
  ['Purchases', 'Purchases by supplier, item and category', [['purchase-by-vendor', 'Purchase By Vendor'], ['purchase-by-item', 'Purchase By Item'], ['purchase-by-category', 'Purchase By Category'], ['po-details', 'Purchase Order Detail'], ['pr-summary', 'Purchase Request Summary'], ['grn-summary', 'GRN Summary'], ['purchase-register', 'Bills Details'], ['purchase-return-details', 'Purchase Return Details']]],
  ['Business Overview', 'Financial statements and cash', [['trial-balance', 'Trial Balance'], ['profit-loss', 'Profit and Loss'], ['balance-sheet', 'Balance Sheet'], ['cash-flow', 'Cash Flow'], ['daily-fund', 'Daily Fund Movement'], ['budget-actual', 'Budget vs Actual']]],
  ['Account Reports', 'Ledgers and summaries', [['ledger-summary', 'Ledger Summary'], ['general-ledger', 'Detailed General Ledger'], ['bank-ledger-summary', 'Bank Ledger Summary'], ['customer-ledger-summary', 'Ledger Summary (Customer)'], ['vendor-ledger-summary', 'Ledger Summary (Vendor)'], ['customer-ledger', 'Customer Statement'], ['supplier-ledger', 'Vendor Statement'], ['day-book', 'Day Book']]],
  ['Inventory Reports', 'Stock levels, valuation and movement', [['item-ledger', 'Item Ledger'], ['stock-summary', 'Inventory Valuation Summary'], ['location-stock', 'Location Wise Stock'], ['category-stock', 'Category Wise Stock'], ['stock-transit', 'Stock in Transit'], ['stock-movement', 'Stock Movement'], ['demand-summary', 'Demand Summary']]],
  ['Tax Reports', 'Sales tax and withholding', [['tax-return', 'Sales Tax Return']]],
  ['Receivable Reports', 'What customers owe', [['customer-balances', 'Customer Balances'], ['receivables-aging', 'AR Aging Summary'], ['payments-received', 'Payment Received']]],
  ['Payable Reports', 'What you owe suppliers', [['vendor-balances', 'Vendor Balances'], ['payables-aging', 'AP Aging Summary'], ['payments-made', 'Payments Made']]],
  ['Expenses Reports', 'Spending by account and category', [['expense-by-account', 'Expense By Account'], ['expense-by-category', 'Expense By Category']]],
  ['Project Reports', 'Project income, cost and profit', [['project-summary', 'Project Summary'], ['project-pl', 'Project Profit & Loss']]],
];
route('/reports', () => {
  page('Reports', `<div class="search rep-search">${icon('search')}<input id="repQ" placeholder="Search reports…"></div><div class="rep-groups">${REPORTS.map(([g, d, list]) => `<div class="card pad rep-card"><h3>${g}</h3><p class="muted sm">${d}</p><ul>${list.map(([k, t]) => `<li><a class="lnk" href="#/reports/${k}">${t}</a></li>`).join('')}</ul></div>`).join('')}</div>`);
  $('#repQ').oninput = e => { const q = e.target.value.toLowerCase(); $$('.rep-card li').forEach(li => { li.style.display = li.textContent.toLowerCase().includes(q) ? '' : 'none'; }); $$('.rep-card').forEach(c => { c.style.display = $$('li', c).some(li => li.style.display !== 'none') ? '' : 'none'; }); };
});
function reportPage(key, title, filters, build) {
  const qs = Object.fromEntries(new URLSearchParams(location.hash.split('?')[1] || ''));
  const s = DB.data.settings, t = U.today();
  const def = { from: U.fyStart(t, s.fyStartMonth), to: t, asOf: t };
  const f = Object.assign({}, def, qs);
  const ctl = {
    project: () => `<label class="inl">Project <select name="project">${projectOpts(f.project)}</select></label>`,
    fy: () => `<label class="inl">Financial year <select name="fy">${opts([-1, 0, 1].map(n => addMonths(U.fyStart(U.today(), s.fyStartMonth), 12 * n)).map(y => [y, y.slice(0, 4) + '-' + String(+y.slice(0, 4) + 1).slice(2)]), f.fy || U.fyStart(U.today(), s.fyStartMonth), null)}</select></label>`,
    from: () => `<label class="inl">From <input type="date" name="from" value="${f.from}"></label>`,
    to: () => `<label class="inl">To <input type="date" name="to" value="${f.to}"></label>`,
    asOf: () => `<label class="inl">As of <input type="date" name="asOf" value="${f.asOf}"></label>`,
    account: () => `<label class="inl">Account <select name="account">${accOpts(f.account)}</select></label>`,
    customer: () => `<label class="inl">Customer <select name="id">${custOpts(f.id)}</select></label>`,
    supplier: () => `<label class="inl">Supplier <select name="id">${suppOpts(f.id)}</select></label>`,
    item: () => `<label class="inl">Item <select name="item">${stockItemOpts(f.item)}</select></label>`,
    warehouse: () => `<label class="inl">Warehouse <select name="wh">${whOpts(f.wh, 'All warehouses')}</select></label>`,
    zero: () => `<label class="inl"><input type="checkbox" name="zero" ${f.zero ? 'checked' : ''}> Show zero balances</label>`,
  };
  page(title, `<div class="card"><div class="toolbar no-print" id="rf">${filters.map(k => ctl[k]()).join('')}</div><div id="rOut" class="rep-out"></div></div>`,
    `<button class="btn" id="rCsv">${icon('dl')} Excel / CSV</button><button class="btn" id="rPrint">${icon('print')} Print</button>`, [['Reports', '#/reports']]);
  const run = () => {
    $$('#rf [name]').forEach(el => { f[el.name] = el.type === 'checkbox' ? (el.checked ? '1' : '') : el.value; });
    const sub = filters.includes('asOf') ? 'As of ' + U.fdate(f.asOf) : filters.includes('from') ? `${U.fdate(f.from)} to ${U.fdate(f.to)}` : '';
    $('#rOut').innerHTML = `<div class="print-only">${printHeader(title, sub)}</div>` + build(f);
    bindRowLinks($('#rOut'));
    const q = new URLSearchParams(Object.fromEntries(Object.entries(f).filter(([k, v]) => v && v !== def[k]))).toString();
    history.replaceState(null, '', `#/reports/${key}${q ? '?' + q : ''}`);
  };
  $$('#rf [name]').forEach(el => el.onchange = run);
  $('#rCsv').onclick = () => { const tb = $('#rOut table'); if (tb) exportTableCSV(tb, key + '-' + U.today()); else toast('Nothing to export', 'err'); };
  $('#rPrint').onclick = () => window.print();
  run();
}
const rowLink = l => `data-href="${l.route}" class="clickable"`;

/* ---- Trial balance ---- */
route('/reports/trial-balance', () => reportPage('trial-balance', 'Trial Balance', ['asOf', 'zero'], f => {
  const rows = leafAccounts().map(a => { const b = R.bal([a.id], { to: f.asOf }); return { a, dr: b > 0 ? b : 0, cr: b < 0 ? -b : 0 }; }).filter(r => f.zero || r.dr || r.cr);
  const dr = U.sum(rows, r => r.dr), cr = U.sum(rows, r => r.cr);
  return table([{ label: 'Code', get: r => r.a.code }, { label: 'Account', html: r => `<a class="lnk" href="#/reports/general-ledger?account=${r.a.id}&to=${f.asOf}">${U.esc(r.a.name)}</a>` }, { label: 'Type', get: r => r.a.type }, { label: 'Debit', cls: 'num', get: r => U.money(r.dr, true) }, { label: 'Credit', cls: 'num', get: r => U.money(r.cr, true) }], rows,
    { foot: [{}, { v: '<b>Total</b>' }, { v: Math.abs(dr - cr) < 0.01 ? '<span class="ok">Balanced ✓</span>' : '<span class="neg">Out of balance</span>' }, { cls: 'num', v: `<b>${U.money(dr)}</b>` }, { cls: 'num', v: `<b>${U.money(cr)}</b>` }], empty: 'No balances to show.' });
}));

/* ---- Profit & loss / balance sheet (grouped statements) ---- */
function stmtSection(types, f, sign) {
  const A = DB.data.accounts;
  const out = [];
  const walk = (pid, d) => A.filter(a => (a.parentId || '') === pid && types.includes(a.type)).sort((a, b) => a.code.localeCompare(b.code)).forEach(a => {
    const v = sign * R.accBal(a.id, f);
    if (Math.abs(v) < 0.005 && !f.zero) return;
    out.push(`<tr class="${a.isGroup ? 'grp' : ''}"><td style="padding-left:${12 + d * 20}px">${a.isGroup ? '<b>' + U.esc(a.name) + '</b>' : `<a class="lnk" href="#/reports/general-ledger?account=${a.id}${f.from ? '&from=' + f.from : ''}&to=${f.to}">${U.esc(a.name)}</a>`}</td><td class="num">${a.isGroup ? '' : U.money(v)}</td><td class="num">${a.isGroup ? '<b>' + U.money(v) + '</b>' : ''}</td></tr>`);
    if (a.isGroup) walk(a.id, d + 1);
  });
  walk('', 0);
  return out.join('');
}
route('/reports/profit-loss', () => reportPage('profit-loss', 'Profit & Loss Statement', ['from', 'to'], f => {
  const r = { from: f.from, to: f.to };
  const inc = -R.bal(DB.data.accounts.filter(a => a.type === 'Income' && !a.isGroup).map(a => a.id), r);
  const cosIds = descendants('g51').filter(id => !acc(id)?.isGroup);
  const cos = acc('g51') ? R.bal(cosIds, r) : 0;
  const exp = R.bal(DB.data.accounts.filter(a => a.type === 'Expense' && !a.isGroup).map(a => a.id), r);
  const np = inc - exp;
  return `<table class="tbl stmt"><thead><tr><th>Particulars</th><th class="num"></th><th class="num">${DB.data.settings.currency}</th></tr></thead><tbody>
    ${stmtSection(['Income'], r, -1)}<tr class="tot"><td>Total income</td><td></td><td class="num">${U.money(inc)}</td></tr>
    ${stmtSection(['Expense'], r, 1)}<tr class="tot"><td>Total expenses</td><td></td><td class="num">${U.money(exp)}</td></tr>
    ${acc('g51') ? `<tr class="sub"><td>Gross profit (income − cost of sales)</td><td></td><td class="num">${U.money(inc - cos)}</td></tr>` : ''}
    <tr class="grand ${np < 0 ? 'neg' : ''}"><td>Net ${np < 0 ? 'loss' : 'profit'} for the period</td><td></td><td class="num">${U.money(np)}</td></tr></tbody></table>`;
}));
route('/reports/balance-sheet', () => reportPage('balance-sheet', 'Balance Sheet', ['asOf', 'zero'], f => {
  const r = { to: f.asOf, zero: f.zero };
  const sumType = t => R.bal(DB.data.accounts.filter(a => a.type === t && !a.isGroup).map(a => a.id), { to: f.asOf });
  const assets = sumType('Asset'), liab = -sumType('Liability'), eq = -sumType('Equity');
  const fy = U.fyStart(f.asOf, DB.data.settings.fyStartMonth);
  const prior = R.profit({ to: U.addDays(fy, -1) }), cur = R.profit({ from: fy, to: f.asOf });

  return `<table class="tbl stmt"><thead><tr><th>Particulars</th><th class="num"></th><th class="num">${DB.data.settings.currency}</th></tr></thead><tbody>
    ${stmtSection(['Asset'], r, 1)}<tr class="grand"><td>Total assets</td><td></td><td class="num">${U.money(assets)}</td></tr>
    ${stmtSection(['Liability'], r, -1)}<tr class="tot"><td>Total liabilities</td><td></td><td class="num">${U.money(liab)}</td></tr>
    ${stmtSection(['Equity'], r, -1)}
    <tr><td style="padding-left:32px">Accumulated profit — prior years</td><td class="num">${U.money(prior)}</td><td></td></tr>
    <tr><td style="padding-left:32px">Profit for the current year</td><td class="num">${U.money(cur)}</td><td></td></tr>
    <tr class="tot"><td>Total equity</td><td></td><td class="num">${U.money(eq + prior + cur)}</td></tr>
    <tr class="grand"><td>Total liabilities & equity</td><td></td><td class="num">${U.money(totLE)}</td></tr></tbody></table>
    <p class="${Math.abs(assets - totLE) < 0.01 ? 'ok' : 'neg'} pad-x">${Math.abs(assets - totLE) < 0.01 ? 'Balance sheet balances ✓' : 'Difference: ' + U.money(assets - totLE)}</p>`;

    table([{ label: 'Type', get: x => x.k }, { label: 'Number', html: x => `<b>${U.esc(x.d.no)}</b>` }, { label: 'Date', get: x => U.fdate(x.d.date) }, { label: 'Party', get: x => x.p }, { label: 'NTN', get: x => x.n }, { label: 'Value excl. tax', cls: 'num', get: x => U.money(x.t.net) }, { label: 'Rate %', cls: 'num', get: x => U.num(x.d.taxRate) }, { label: 'Sales tax', cls: 'num', get: x => U.money(x.t.tax) }],
      inv.map(x => Object.assign({ k: 'Sale', p: partyName('C', x.d.customerId), n: party('C', x.d.customerId)?.ntn || '', r: '#/invoices/' + x.d.id }, x)).concat(bills.map(x => Object.assign({ k: 'Purchase', p: partyName('S', x.d.supplierId), n: party('S', x.d.supplierId)?.ntn || '', r: '#/bills/' + x.d.id }, x)))
        .concat(sr.map(x => Object.assign({ k: 'Sales return', p: partyName('C', x.d.customerId), n: party('C', x.d.customerId)?.ntn || '', r: '#/sales-returns/' + x.d.id }, x, { t: Object.assign({}, x.t, { net: -x.t.net, tax: -x.t.tax }) })))
        .concat(pr.map(x => Object.assign({ k: 'Purchase return', p: partyName('S', x.d.supplierId), n: party('S', x.d.supplierId)?.ntn || '', r: '#/purchase-returns/' + x.d.id }, x, { t: Object.assign({}, x.t, { net: -x.t.net, tax: -x.t.tax }) }))),

function partyLedger(PT) {
  return f => {
    if (!f.id) return `<div class="empty">Choose a ${PT === 'C' ? 'customer' : 'supplier'}.</div>`;
    const sign = PT === 'C' ? 1 : -1, p = party(PT, f.id);

    const ls = R.partyLines(PT, f.id, { from: f.from, to: f.to }).map(l => { run += sign * (l.debit - l.credit); return Object.assign({ run }, l); });
    return `<div class="pad-x"><b>${U.esc(p.name)}</b> ${p.phone ? '· ' + U.esc(p.phone) : ''} ${p.city ? '· ' + U.esc(p.city) : ''}</div>` + table([

  };

/* ---- Aging ---- */
function aging(PT) {
  return f => {
    const list = PT === 'C' ? DB.data.customers : DB.data.suppliers;
    const B = ['Current', '1–30', '31–60', '61–90', '90+'];
    const rows = list.map(p => {
      const open = R.openDocs(PT, p.id, f.asOf), b = [0, 0, 0, 0, 0];
      Object.values(open).forEach(o => {
        if (o.open <= 0) return;
        const due = o.doc.dueDate || U.addDays(o.doc.date, U.num(p.terms));
        const days = U.daysBetween(due, f.asOf);
        b[days <= 0 ? 0 : days <= 30 ? 1 : days <= 60 ? 2 : days <= 90 ? 3 : 4] += o.open;
      });
      const total = R.partyBal(PT, p.id, f.asOf);
      const allocated = U.sum(b);
      if (total - allocated > 0.005) b[0] += total - allocated; // unallocated debit (e.g. journal)
      return { p, b, total };
    }).filter(r => Math.abs(r.total) > 0.005).sort((a, b) => b.total - a.total);
    return table([{ label: PT === 'C' ? 'Customer' : 'Supplier', html: r => `<a class="lnk" href="#/reports/${PT === 'C' ? 'customer' : 'supplier'}-ledger?id=${r.p.id}">${U.esc(r.p.name)}</a>` }, ...B.map((l, i) => ({ label: l, cls: 'num', get: r => U.money(r.total < 0 && i === 0 ? r.total : r.b[i], true) })), { label: 'Total', cls: 'num', html: r => `<b>${U.money(r.total)}</b>` }],
      rows, { empty: 'No outstanding balances.', foot: [{ v: '<b>Total</b>' }, ...B.map((_, i) => ({ cls: 'num', v: `<b>${U.money(U.sum(rows, r => r.total < 0 && i === 0 ? r.total : r.b[i]))}</b>` })), { cls: 'num', v: `<b>${U.money(U.sum(rows, r => r.total))}</b>` }] }) +
      '<p class="muted pad-x sm">Days counted from the due date. Payments are applied to the oldest documents first. Negative figures are advances.</p>';
  };
}
route('/reports/receivables-aging', () => reportPage('receivables-aging', 'Receivables Aging', ['asOf'], aging('C')));
route('/reports/payables-aging', () => reportPage('payables-aging', 'Payables Aging', ['asOf'], aging('S')));

route('/reports/item-sales', () => reportPage('item-sales', 'Item-wise Sales & Profit', ['from', 'to'], f => {

  DB.data.invoices.filter(d => d.date >= f.from && d.date <= f.to).forEach(d => { calcDoc(d); d.lines.forEach(l => { const r = res[l.itemId] || (res[l.itemId] = { qty: 0, rev: 0, cost: 0 }); r.qty += U.num(l.qty); r.rev += U.num(l.amount); }); });

}));

const tot = (rows, k) => U.sum(rows, r => r[k]);
const moneyCol = (label, k, bold) => ({ label, cls: 'num', html: r => bold ? `<b>${U.money(r[k])}</b>` : U.money(r[k]) });
const footFor = (cols, rows, labelIdx = 0) => cols.map((c, i) => i === labelIdx ? { v: '<b>Total</b>' } : c.sumKey ? { cls: 'num', v: `<b>${c.qty ? U.qty(tot(rows, c.sumKey)) : U.money(tot(rows, c.sumKey))}</b>` } : {});
function grouped(items, keyFn) { const m = new Map(); items.forEach(x => { const k = keyFn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; }

// sales / purchase line facts (returns negative)
function saleLines(f) {
  const out = [];
  const add = (d, sign, kind) => { const t = calcDoc(d); const ratio = t.net ? (t.net + t.other) / t.net : 1; d.lines.forEach(l => out.push({ d, kind, cust: d.customerId, sm: d.salesmanId, itemId: l.itemId, qty: sign * U.num(l.qty), amount: sign * U.num(l.amount) * ratio, tax: sign * U.num(l.amount) * U.num(d.taxRate) / 100 })); };
  DB.data.invoices.filter(d => inP(d, f)).forEach(d => add(d, 1, 'Invoice'));
  DB.data.salesReturns.filter(d => inP(d, f)).forEach(d => add(d, -1, 'Return'));
  return out;
}
function purchaseLines(f) {
  const out = [];
  const add = (d, sign) => { const t = calcDoc(d); const ratio = t.net ? (t.net + t.other) / t.net : 1; d.lines.forEach(l => out.push({ d, sup: d.supplierId, itemId: l.itemId, qty: sign * U.num(l.qty), amount: sign * U.num(l.amount) * ratio, tax: sign * U.num(l.amount) * U.num(d.taxRate) / 100 })); };
  DB.data.bills.filter(d => inP(d, f)).forEach(d => add(d, 1));
  DB.data.purchaseReturns.filter(d => inP(d, f)).forEach(d => add(d, -1));
  return out;
}
function groupTable(lines, keyFn, labelCol, extra = []) {
  const rows = [...grouped(lines, keyFn)].map(([k, ls]) => ({ k, ls, qty: tot(ls, 'qty'), amount: tot(ls, 'amount'), tax: tot(ls, 'tax'), docs: new Set(ls.map(l => l.d.id)).size })).map(r => Object.assign(r, { total: r.amount + r.tax })).sort((a, b) => b.amount - a.amount);
  const cols = [labelCol, { label: 'Documents', cls: 'num', get: r => r.docs }, ...extra, Object.assign(moneyCol('Amount (excl. tax)', 'amount'), { sumKey: 'amount' }), Object.assign(moneyCol('Sales tax', 'tax'), { sumKey: 'tax' }), Object.assign(moneyCol('Total', 'total', true), { sumKey: 'total' })];
  return table(cols, rows, { empty: 'Nothing in this period.', foot: footFor(cols, rows) });
}

/* ---- Business overview ---- */
function cashMovements(f) {
  const cash = new Set(cashBankAccounts().map(a => a.id)), all = Ledger.get().lines;
  const byDoc = grouped(all.filter(l => inP(l, f)), l => l.docId + '|' + l.no);
  const res = [];
  byDoc.forEach(ls => {
    const c = U.sum(ls.filter(l => cash.has(l.accountId)), l => l.debit - l.credit);
    if (Math.abs(c) < 0.005) return;
    const contra = ls.filter(l => !cash.has(l.accountId)).map(l => acc(l.accountId)).filter(Boolean);
    const inv = contra.some(a => descendants('g12').includes(a.id));
    const fin = contra.some(a => a.type === 'Equity' || descendants('g22').includes(a.id));
    res.push({ l: ls[0], amt: c, cat: inv ? 'Investing' : fin ? 'Financing' : contra.length ? 'Operating' : 'Transfers between cash & bank' });
  });
  return res;
}
route('/reports/cash-flow', () => reportPage('cash-flow', 'Cash Flow Statement', ['from', 'to'], f => {
  const ids = cashBankAccounts().map(a => a.id);
  const open = R.bal(ids, { to: U.addDays(f.from, -1) }), close = R.bal(ids, { to: f.to });
  const mv = cashMovements(f).filter(m => m.cat !== 'Transfers between cash & bank');
  const sec = cat => { const ms = mv.filter(m => m.cat === cat); const g = [...grouped(ms, m => m.l.type)].map(([t, xs]) => ({ t, in: U.sum(xs.filter(x => x.amt > 0), x => x.amt), out: U.sum(xs.filter(x => x.amt < 0), x => x.amt) }));
    const net = U.sum(ms, m => m.amt);
    return `<tr class="grp"><td colspan="2"><b>Cash flows from ${cat.toLowerCase()} activities</b></td></tr>${g.map(r => `${r.in ? `<tr><td style="padding-left:32px">${U.esc(r.t)} — receipts</td><td class="num">${U.money(r.in)}</td></tr>` : ''}${r.out ? `<tr><td style="padding-left:32px">${U.esc(r.t)} — payments</td><td class="num">${U.money(r.out)}</td></tr>` : ''}`).join('') || '<tr><td style="padding-left:32px" class="muted">None</td><td></td></tr>'}<tr class="tot"><td>Net cash from ${cat.toLowerCase()} activities</td><td class="num">${U.money(net)}</td></tr>`; };
  const net = U.sum(mv, m => m.amt);
  return `<table class="tbl stmt"><thead><tr><th>Particulars</th><th class="num">${DB.data.settings.currency}</th></tr></thead><tbody>
    <tr><td><b>Opening cash & bank balance</b></td><td class="num"><b>${U.money(open)}</b></td></tr>${sec('Operating')}${sec('Investing')}${sec('Financing')}
    <tr class="tot"><td>Net increase / (decrease) in cash</td><td class="num">${U.money(net)}</td></tr>
    <tr class="grand"><td>Closing cash & bank balance</td><td class="num">${U.money(close)}</td></tr></tbody></table>
    <p class="${Math.abs(open + net - close) < 0.01 ? 'ok' : 'neg'} pad-x sm">${Math.abs(open + net - close) < 0.01 ? 'Reconciles to closing balance ✓' : 'Difference ' + U.money(open + net - close)}</p>`;
}));
