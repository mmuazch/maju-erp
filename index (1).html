<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maju ERP</title>
<meta name="description" content="Maju ERP — accounting, sales, purchases and inventory.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3EMJ%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#18212b; --muted:#667385; --line:#e3e8ee; --line2:#eef2f5;
  --side:#0d1b24; --side2:#14262f; --side-ink:#b9c7cf;
  --acc:#0f766e; --acc2:#0b5f59; --acc-soft:#e6f3f1;
  --red:#c2410c; --red-soft:#fdeee6; --green:#15803d; --amber:#b45309; --blue:#1d4ed8;
  --r:10px; --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
a{color:inherit;text-decoration:none}
.ic{width:18px;height:18px;flex:none}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- layout ---------- */
#sidebar{position:fixed;inset:0 auto 0 0;width:244px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px;border-bottom:1px solid #1d3340}
.brand .logo{width:36px;height:36px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;letter-spacing:.5px}
.brand b{display:block;color:#fff;font-size:14.5px}.brand small{font-size:11.5px;color:#7f97a4}
#nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#5f7884;padding:14px 10px 6px;font-weight:700}
.nav-top{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--side-ink);text-align:left}
.nav-top:hover{background:var(--side2);color:#fff}
.nav-top.active{background:var(--acc);color:#fff}
.nav-top span{flex:1}
.chev{width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:.15s}
.nav-group.open .chev{transform:rotate(45deg)}
.nav-sub{display:none;padding:2px 0 6px 38px}
.nav-group.open .nav-sub{display:block}
.nav-sub a{display:block;padding:6px 10px;border-radius:6px;font-size:13.5px}
.nav-sub a:hover{color:#fff;background:var(--side2)}
.nav-sub a.active{color:#fff;background:var(--side2);box-shadow:inset 3px 0 0 var(--acc)}
.side-foot{padding:12px 16px;font-size:11.5px;color:#6b8592;border-top:1px solid #1d3340}
#wrap{margin-left:244px;min-height:100vh}
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
#menuBtn{display:none}
#crumbs{flex:1;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden}
#crumbs a:hover{color:var(--acc)} #crumbs b{color:var(--ink)}
.top-right{display:flex;align-items:center;gap:10px}
.co{font-weight:600}
.pill{background:var(--line2);border-radius:20px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
#main{padding:22px 24px 60px;max-width:1400px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- elements ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.pad{padding:18px}.pad-x{padding-left:16px;padding-right:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-h.pad-x{padding-top:14px}
.card h3,h3{margin:0;font-size:15px;font-weight:650}
h3.sec{margin:22px 0 10px;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.6px}
.mt{margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{border-color:#c9d2db;background:#fafbfc}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.primary:hover{background:var(--acc2)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger.ghost{background:#fff;color:var(--red);border-color:#f3d2c3}
.btn.ghost{background:transparent}
.btn.sm{height:30px;font-size:13px;margin:8px 0}
.btn .ic{width:16px;height:16px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--line2);color:var(--ink)}
.lnk{color:var(--acc);font-weight:550}.lnk:hover{text-decoration:underline}
.muted{color:var(--muted)}.sm{font-size:12.5px}
.neg{color:var(--red)}.ok,.good{color:var(--green)}
.sp{flex:1}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--acc-soft);color:var(--acc);margin-left:6px;font-weight:600}
.tag.t2{background:#eef2ff;color:var(--blue)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;background:var(--line2);color:var(--muted)}
.b-paid,.b-receipt{background:#e7f6ec;color:var(--green)}
.b-partial{background:#fef5e4;color:var(--amber)}
.b-overdue{background:var(--red-soft);color:var(--red)}
.b-unpaid,.b-payment{background:#eef2ff;color:var(--blue)}
.b-stock{background:var(--acc-soft);color:var(--acc)}

/* ---------- toolbar / forms ---------- */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:0 10px;height:36px;background:#fff;min-width:240px}
.search input{border:0;outline:0;flex:1;height:34px}
.search .ic{color:var(--muted);width:16px}
label.inl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
input,select,textarea{border:1px solid #d5dce3;border-radius:7px;padding:7px 9px;background:#fff;min-height:36px;outline:0;width:100%}
label.inl input,label.inl select{width:auto}
label.inl select{max-width:280px}
input[type=checkbox]{width:auto;min-height:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(15,118,110,.14)}
.grid2,.grid3{display:grid;gap:14px 16px;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.fld label{display:block;font-size:12.5px;font-weight:600;color:#3c4856;margin-bottom:5px}
.fld small{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
.fld.wide{grid-column:1/-1}
.fld.chk label{display:flex;gap:8px;align-items:center;font-weight:550;margin-top:22px}
.req{color:var(--red);font-style:normal}
.form-foot{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.info{margin-top:14px;padding:10px 12px;background:var(--acc-soft);border-radius:8px;font-size:13px}
.info:empty{display:none}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;background:#f8fafb;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tfoot td{background:#f8fafb;border-top:1px solid var(--line);border-bottom:0}
.tbl .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.clickable{cursor:pointer}.tbl tr.clickable:hover td{background:#f5faf9}
.tbl tr.grp td{background:#fbfcfd}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.stmt td{padding:7px 12px}.stmt tr.tot td{font-weight:650;border-top:1px solid var(--line)}
.stmt tr.sub td{font-style:italic;color:var(--muted)}
.stmt tr.grand td{font-weight:700;font-size:15px;background:var(--acc-soft);border-top:2px solid var(--acc)}
.stmt tr.grand.neg td{background:var(--red-soft);border-top-color:var(--red)}

/* ---------- document editor ---------- */
.doc .tbl.lines{margin-top:18px;border:1px solid var(--line);border-radius:8px}
.lines td{padding:6px 6px;vertical-align:top}
.lines th{padding:8px 6px}
.lines input,.lines select{min-height:34px;padding:6px 7px}
.lines .w-item{min-width:220px}.lines .w-desc{min-width:180px}.lines .w-num{width:110px}.lines .w-sm{width:80px}
.lines td.calc{padding-top:14px;color:#3c4856}
.lines td.x{width:36px}
.lines .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.doc-foot{display:grid;grid-template-columns:1fr 380px;gap:24px;margin-top:10px}
.totals{background:#f8fafb;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.totals .tr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0}
.totals .tr span{display:flex;align-items:center;gap:6px}
.totals .tr.grand{border-top:1px solid var(--line);margin-top:4px;padding-top:9px;font-size:16px}
.totals .tr.grand.bad{color:var(--red)}.totals .tr.grand.good{color:var(--green)}
.totals .tr.paid{border-top:1px dashed var(--line);margin-top:4px;padding-top:9px;font-size:13px}
.totals .tr.paid select{width:150px;min-height:30px;padding:4px}
.mini{width:64px;min-height:30px;padding:4px 6px;text-align:right}.mini.w{width:110px}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpis.sm{padding:16px;margin:0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:block}
a.kpi:hover{border-color:var(--acc)}
.kpi span{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.kpi b{display:block;font-size:21px;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi.neg b{color:var(--red)}.kpi.pos b{color:var(--green)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.grid-2 .card{margin-bottom:16px}
.grid-2 .card .tbl-wrap{margin:0 -18px -18px}
.chart{width:100%;height:auto}
.chart .bar-s{fill:var(--acc)}.chart .bar-p{fill:#9fb6c3}
.chart .axis{font-size:11px;fill:var(--muted)}.chart .base{stroke:var(--line)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}.lg-s{background:var(--acc)}.lg-p{background:#9fb6c3;margin-left:8px}
.welcome{border-left:4px solid var(--acc)}.welcome ol{margin:8px 0 0;padding-left:20px}.welcome li{margin:4px 0}.welcome a{color:var(--acc);font-weight:600}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.grid-cards .card{margin:0}.grid-cards p{margin:8px 0 14px}
.counts{columns:2;padding-left:18px;margin:0 0 14px;font-size:13px}

/* ---------- reports ---------- */
.rep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rep{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.rep:hover{border-color:var(--acc);box-shadow:0 2px 10px rgba(15,118,110,.08)}
.rep b{display:block;margin-bottom:3px}.rep span{color:var(--muted);font-size:13px}
.rep-out p{margin:12px 0}
.print-only{display:none}

a.kpi.bank small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
a.kpi.bank.sel{border-color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-3 .card{margin:0}.grid-3 h3{margin-bottom:12px}
.hb{display:grid;grid-template-columns:minmax(0,1.1fr) 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb b{font-variant-numeric:tabular-nums;font-size:12.5px}
.hb div{background:var(--line2);border-radius:4px;height:10px}.hb i{display:block;height:10px;border-radius:4px}
.hb .c1{background:var(--acc)}.hb .c2{background:#2563eb}.hb .c3{background:#d97706}
.rep-search{max-width:420px;margin-bottom:16px;background:#fff}
.rep-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.rep-card{margin:0}.rep-card p{margin:4px 0 10px}.rep-card ul{list-style:none;margin:0;padding:0}.rep-card li{padding:5px 0;border-top:1px solid var(--line2)}
.budget td{padding:4px 4px}.budget td:first-child{white-space:nowrap;padding-left:12px}.budget .mini{width:84px}
.b-converted,.b-invoiced,.b-billed,.b-received,.b-issued,.b-posted,.b-active,.b-completed{background:#e7f6ec;color:var(--green)}
.b-open,.b-not-invoiced,.b-not-billed,.b-in-transit,.b-partly-received,.b-on-hold,.b-paused{background:#fef5e4;color:var(--amber)}
.b-expired,.b-cancelled{background:var(--red-soft);color:var(--red)}
.b-money-in{background:#e7f6ec;color:var(--green)}.b-money-out{background:#eef2ff;color:var(--blue)}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(13,27,36,.45);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .12s}
.modal{background:#fff;border-radius:12px;width:min(620px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(900px,100%)}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-head h3{font-size:16px}
.m-body{padding:18px;overflow-y:auto}
.m-foot{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.m-foot:empty{display:none}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--side);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:.3s;border-left:4px solid var(--acc)}
.toast.err{border-left-color:#f97316}
.toast.out{opacity:0;transform:translateY(8px)}
@keyframes fade{from{opacity:0}}

/* ---------- print layouts ---------- */
.print-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #222;padding-bottom:10px;margin-bottom:14px}
.print-head h2{margin:0 0 4px;font-size:18px}.ph-right{text-align:right}
.bill-to{margin:10px 0 14px}.bill-to small{display:block;text-transform:uppercase;color:#666;font-size:11px}
.print-totals{margin:12px 0 0 auto;width:300px}
.print-totals div{display:flex;justify-content:space-between;padding:3px 0}
.print-totals .grand{border-top:2px solid #222;font-size:15px;margin-top:4px;padding-top:6px}
.signs{display:flex;gap:30px;margin-top:70px}.signs div{flex:1;border-top:1px solid #333;padding-top:6px;text-align:center;font-size:12px}
#printArea{display:none}

@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:12px}
  #sidebar,#topbar,.page-head,.no-print,#toasts,#modalRoot{display:none!important}
  #wrap{margin:0}#main{padding:0;max-width:none}
  .card{border:0;margin:0}
  .print-only{display:block}
  .tbl th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tbl td,.tbl th{padding:5px 7px}
  a.lnk{color:inherit}
  body.printing-doc #main > *:not(#printArea){display:none!important}
  #printArea:not(:empty){display:block}
  body:has(#printArea:not(:empty)) #main > *:not(#printArea){display:none!important}
}

/* ---------- responsive ---------- */
@media (max-width:980px){
  #sidebar{transform:translateX(-100%);transition:.2s}
  body.nav-open #sidebar{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  #wrap{margin-left:0}
  #menuBtn{display:inline-grid}
  .grid-2,.grid-3,.doc-foot{grid-template-columns:1fr}
  #main{padding:16px}
  .co{display:none}
}
@media (max-width:600px){ .grid2{grid-template-columns:1fr} .search{min-width:0;flex:1} }

</style>

<body>
<noscript>This application needs JavaScript enabled.</noscript>
<script>
'use strict';
/* =========================================================
   Maju ERP — core: utilities, storage, ledger
   All data lives in the browser (localStorage).
   ========================================================= */
const APP = { name: 'Maju ERP', short: 'Maju ERP', version: '2.0.0' };
const STORE_KEY = 'majuErp.data.v1';

const U = {
  uid: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
  today() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); },
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  num(v) { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; },
  r2: n => Math.round((n + Number.EPSILON) * 100) / 100,
  money(n, blankZero) {
    n = U.r2(+n || 0);
    if (blankZero && Math.abs(n) < 0.005) return '';
    const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return n < 0 ? '(' + s + ')' : s;
  },
  qty: n => (+n || 0).toLocaleString('en-US', { maximumFractionDigits: 3 }),
  fdate(d) {
    if (!d) return '';
    const [y, m, day] = d.split('-');
    return `${day}-${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m - 1]}-${y}`;
  },
  addDays(d, n) { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); },
  daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000); },
  fyStart(date, startMonth) {
    const [y, m] = date.split('-').map(Number);
    const sy = m >= startMonth ? y : y - 1;
    return `${sy}-${String(startMonth).padStart(2, '0')}-01`;
  },
  monthStart: d => d.slice(0, 8) + '01',
  sum: (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0),
};

/* ---------------- Default chart of accounts ---------------- */
function defaultAccounts() {
  const A = [];
  const g = (id, code, name, type, parent) => A.push({ id, code, name, type, parentId: parent || '', isGroup: true });
  const a = (id, code, name, type, parent, extra) => A.push(Object.assign({ id, code, name, type, parentId: parent, isGroup: false }, extra || {}));
  g('g1', '1', 'Assets', 'Asset');
  g('g11', '11', 'Current Assets', 'Asset', 'g1');
  a('a1101', '1101', 'Cash in Hand', 'Asset', 'g11', { cashBank: true });
  a('a1102', '1102', 'Bank Account', 'Asset', 'g11', { cashBank: true });
  a('a1103', '1103', 'Accounts Receivable (Debtors)', 'Asset', 'g11');
  a('a1104', '1104', 'Inventory / Stock in Trade', 'Asset', 'g11');
  a('a1105', '1105', 'Sales Tax Receivable (Input Tax)', 'Asset', 'g11');
  a('a1106', '1106', 'Advance Income Tax', 'Asset', 'g11');
  a('a1107', '1107', 'Advances & Prepayments', 'Asset', 'g11');
  g('g12', '12', 'Non-Current Assets', 'Asset', 'g1');
  a('a1201', '1201', 'Furniture & Fixtures', 'Asset', 'g12');
  a('a1202', '1202', 'Office Equipment', 'Asset', 'g12');
  a('a1203', '1203', 'Vehicles', 'Asset', 'g12');
  a('a1204', '1204', 'Accumulated Depreciation', 'Asset', 'g12');
  g('g2', '2', 'Liabilities', 'Liability');
  g('g21', '21', 'Current Liabilities', 'Liability', 'g2');

/* ---------------- Storage ---------------- */
const DB = {
  data: null,
  load() {
    try { const raw = localStorage.getItem(STORE_KEY); this.data = raw ? JSON.parse(raw) : defaultData(); }
    catch (e) { this.data = defaultData(); }
    const d = defaultData();
    for (const k in d) if (this.data[k] === undefined) this.data[k] = d[k];
    for (const k in d.settings.links) if (!this.data.settings.links[k]) this.data.settings.links[k] = d.settings.links[k];
    d.accounts.forEach(a => { if (!this.data.accounts.some(x => x.id === a.id) && Object.values(this.data.settings.links).includes(a.id)) this.data.accounts.push(a); });
    Ledger.invalidate();
  },
  save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); }
    catch (e) { alertBox('Could not save: browser storage is full or blocked.'); }
    Ledger.invalidate();
  },
  list(key) { return this.data[key]; },
  get(key, id) { return this.data[key].find(x => x.id === id); },
  upsert(key, obj) {
    const arr = this.data[key];
    if (!obj.id) { obj.id = U.uid(); obj.createdAt = Date.now(); arr.push(obj); }
    else { const i = arr.findIndex(x => x.id === obj.id); if (i >= 0) arr[i] = Object.assign({}, arr[i], obj); else arr.push(obj); }
    this.save();
    return obj;
  },
  remove(key, id) { this.data[key] = this.data[key].filter(x => x.id !== id); this.save(); },
  nextNo(prefix) {
    const c = this.data.counters;
    c[prefix] = (c[prefix] || 0) + 1;
    return prefix + '-' + String(c[prefix]).padStart(4, '0');
  },
  reset() { this.data = defaultData(); this.save(); },
};

/* ---------------- Lookups ---------------- */
const L = () => DB.data.settings.links;
const acc = id => DB.data.accounts.find(a => a.id === id);
const accName = id => { const a = acc(id); return a ? `${a.code} · ${a.name}` : '—'; };
const party = (type, id) => (type === 'C' ? DB.data.customers : DB.data.suppliers).find(p => p.id === id);
const partyName = (type, id) => party(type, id)?.name || '—';
const item = id => DB.data.items.find(i => i.id === id);
const wh = id => DB.data.warehouses.find(w => w.id === id);
const leafAccounts = () => DB.data.accounts.filter(a => !a.isGroup).sort((a, b) => a.code.localeCompare(b.code));
const cashBankAccounts = () => leafAccounts().filter(a => a.cashBank);
function descendants(id) {
  const out = [id];
  DB.data.accounts.filter(a => a.parentId === id).forEach(c => out.push(...descendants(c.id)));
  return out;
}
const NORMAL_DEBIT = { Asset: true, Expense: true, Liability: false, Equity: false, Income: false };

/* ---------------- Document totals ---------------- */
function calcDoc(doc) {
  let sub = 0, disc = 0;
  (doc.lines || []).forEach(l => {
    const gross = U.num(l.qty) * U.num(l.rate);
    const d = gross * U.num(l.disc) / 100;
    l.amount = U.r2(gross - d);
    sub += gross; disc += d;
  });
  const net = U.r2(sub - disc);
  const tax = U.r2(net * U.num(doc.taxRate) / 100);
  const other = U.num(doc.otherCharges);
  return { gross: U.r2(sub), discount: U.r2(disc), net, tax, other, total: U.r2(net + tax + other) };
}

/* =========================================================
   Ledger engine
   Journal lines and stock movements are DERIVED from the
   documents every time data changes, so balances, stock
   quantities and weighted-average costs are always consistent.
   ========================================================= */
const TRANSIT = '__transit';
const Ledger = {
  _c: null,
  invalidate() { this._c = null; },
  get() { if (!this._c) this._c = this.build(); return this._c; },

  build() {
    const db = DB.data, K = db.settings.links, OD = db.settings.openingDate;
    const lines = [], moves = [];
    const inv = {};
    const st = id => inv[id] || (inv[id] = { qty: 0, value: 0 });
    const events = [];
    const ev = (date, order, doc, fn) => events.push({ date: date || OD, order, t: doc.createdAt || 0, fn });
    const list = k => db[k] || [];

    const post = (h, ls) => {
      ls.forEach(l => {
        const dr = U.r2(U.num(l.dr)), cr = U.r2(U.num(l.cr));
        if (!l.a || (Math.abs(dr) < 0.005 && Math.abs(cr) < 0.005)) return;
        lines.push({ date: h.date, no: h.no, type: h.type, docId: h.docId, route: h.route, memo: l.memo || h.memo || '', accountId: l.a, debit: dr, credit: cr, partyType: l.pt || '', partyId: l.pid || '', projectId: l.prj || h.projectId || '' });
      });
    };
    const avg = id => { const s = st(id); return s.qty > 0.0000001 ? s.value / s.qty : U.num(item(id)?.costPrice); };
    const mv = (h, itemId, whId, qty, cost, extra, value) => moves.push(Object.assign({ date: h.date, no: h.no, type: h.type, docId: h.docId, route: h.route, itemId, warehouseId: whId, qty, cost, value: value ?? U.r2(qty * cost), party: h.party || '' }, extra || {}));
    const mIn = (h, itemId, whId, qty, unitCost) => { const s = st(itemId); const v = U.r2(qty * unitCost); s.qty += qty; s.value += v; mv(h, itemId, whId, qty, unitCost, null, v); return v; };
    const mOut = (h, itemId, whId, qty) => {
      const s = st(itemId); const c = avg(itemId); const v = Math.abs(s.qty - qty) < 1e-7 && s.qty > 0 ? U.r2(s.value) : U.r2(qty * c);
      s.qty -= qty; s.value -= v; if (Math.abs(s.qty) < 1e-7) { s.qty = 0; s.value = 0; }
      mv(h, itemId, whId, -qty, c, null, -v); return v;
    };
    const isStock = id => (item(id)?.type || 'Stock') === 'Stock';
    const hd = (d, type, route, memo, pt, pid) => ({ date: d.date, no: d.no, type, docId: d.id, route, memo, party: pt ? partyName(pt, pid) : '', projectId: d.projectId || '' });
    const incAcc = id => item(id)?.incomeAccountId || (isStock(id) ? K.sales : K.serviceRevenue);

    // ---------- opening balances ----------
    db.customers.forEach(c => { const v = U.num(c.opening); if (v) ev(OD, 0, c, () => post(
      { date: OD, no: 'OPENING', type: 'Opening', docId: c.id, route: '#/customers', memo: 'Opening balance — ' + c.name },
      [{ a: K.ar, dr: v > 0 ? v : 0, cr: v < 0 ? -v : 0, pt: 'C', pid: c.id }, { a: K.openingEquity, dr: v < 0 ? -v : 0, cr: v > 0 ? v : 0 }])); });
    db.suppliers.forEach(c => { const v = U.num(c.opening); if (v) ev(OD, 0, c, () => post(
      { date: OD, no: 'OPENING', type: 'Opening', docId: c.id, route: '#/suppliers', memo: 'Opening balance — ' + c.name },
      [{ a: K.ap, cr: v > 0 ? v : 0, dr: v < 0 ? -v : 0, pt: 'S', pid: c.id }, { a: K.openingEquity, cr: v < 0 ? -v : 0, dr: v > 0 ? v : 0 }])); });
    db.accounts.forEach(a => { const v = U.num(a.opening); if (!a.isGroup && v) ev(OD, 0, a, () => {
      const debitSide = NORMAL_DEBIT[a.type] ? v > 0 : v < 0; const amt = Math.abs(v);
      post({ date: OD, no: 'OPENING', type: 'Opening', docId: a.id, route: '#/accounts', memo: 'Opening balance — ' + a.name },
        [{ a: a.id, dr: debitSide ? amt : 0, cr: debitSide ? 0 : amt }, { a: K.openingEquity, dr: debitSide ? 0 : amt, cr: debitSide ? amt : 0 }]);
    }); });
    db.items.forEach(it => { const q = U.num(it.openingQty); if (q && isStock(it.id)) ev(OD, 0, it, () => {
      const h = { date: OD, no: 'OPENING', type: 'Opening Stock', docId: it.id, route: '#/items', memo: 'Opening stock — ' + it.name };
      const c = U.num(it.openingCost || it.costPrice);
      const v = mIn(h, it.id, it.openingWarehouse || db.warehouses[0]?.id, q, c);
      post(h, [{ a: K.inventory, dr: v }, { a: K.openingEquity, cr: v }]);
    }); });

    // ---------- stock IN documents (order 1) ----------
    list('grns').forEach(d => ev(d.date, 1, d, () => {
      const t = calcDoc(d), h = hd(d, 'Goods Receive Note', '#/grn/' + d.id, 'Goods received — ' + partyName('S', d.supplierId), 'S', d.supplierId);
      let val = 0;
      d.lines.forEach(l => { const q = U.num(l.qty); if (!l.itemId || !q || !isStock(l.itemId)) return; val += mIn(h, l.itemId, d.warehouseId, q, l.amount / q); });
      void t; post(h, [{ a: K.inventory, dr: val }, { a: K.grni, cr: val }]);
    }));
    list('bills').forEach(d => ev(d.date, 1, d, () => {
      const t = calcDoc(d), h = hd(d, 'Bill', '#/bills/' + d.id, 'Purchase — ' + partyName('S', d.supplierId), 'S', d.supplierId);
      const ls = [], net = t.net || 1;
      d.lines.forEach(l => {
        if (!l.itemId) return;
        const share = l.amount + (t.other * l.amount / net), it = item(l.itemId);
        if (isStock(l.itemId)) {
          if (d.grnId) ls.push({ a: K.grni, dr: share, memo: it?.name });
          else { const q = U.num(l.qty); const v = q ? mIn(h, l.itemId, d.warehouseId, q, share / q) : share; ls.push({ a: K.inventory, dr: v, memo: it?.name }, { a: K.stockAdj, dr: U.r2(share - v), memo: 'Rounding' }); }
        } else ls.push({ a: it?.expenseAccountId || K.purchaseExpense, dr: share, memo: it?.name });
      });
      ls.push({ a: K.inputTax, dr: t.tax }, { a: K.ap, cr: t.total, pt: 'S', pid: d.supplierId });
      if (U.num(d.paidAmount) && d.paidAccountId) ls.push({ a: K.ap, dr: U.num(d.paidAmount), pt: 'S', pid: d.supplierId, memo: 'Paid on bill' }, { a: d.paidAccountId, cr: U.num(d.paidAmount), memo: 'Paid on bill' });
      post(h, ls);
    }));
    list('salesReturns').forEach(d => ev(d.date, 1, d, () => {
      const t = calcDoc(d), h = hd(d, 'Sales Return', '#/sales-returns/' + d.id, 'Sales return — ' + partyName('C', d.customerId), 'C', d.customerId);
      const ls = [{ a: K.ar, cr: t.total, pt: 'C', pid: d.customerId }, { a: K.outputTax, dr: t.tax }];
      if (t.other) ls.push({ a: K.sales, dr: t.other });
      let cost = 0;
      d.lines.forEach(l => {
        if (!l.itemId) return;
        ls.push({ a: incAcc(l.itemId), dr: l.amount, memo: item(l.itemId)?.name });
        if (isStock(l.itemId) && U.num(l.qty) && d.restock !== 'no') cost += mIn(h, l.itemId, d.warehouseId, U.num(l.qty), avg(l.itemId));
      });
      if (cost) ls.push({ a: K.inventory, dr: cost, memo: 'Returned to stock' }, { a: K.cogs, cr: cost, memo: 'Returned to stock' });
      if (U.num(d.refundAmount) && d.refundAccountId) ls.push({ a: K.ar, dr: U.num(d.refundAmount), pt: 'C', pid: d.customerId, memo: 'Refund' }, { a: d.refundAccountId, cr: U.num(d.refundAmount), memo: 'Refund' });
      post(h, ls);
    }));
    list('dnReturns').forEach(d => ev(d.date, 1, d, () => {
      const h = hd(d, 'Delivery Note Return', '#/delivery-note-returns/' + d.id, 'Goods returned — ' + partyName('C', d.customerId), 'C', d.customerId);
      let cost = 0;
      d.lines.forEach(l => { const q = U.num(l.qty); if (!l.itemId || !q || !isStock(l.itemId)) return; cost += mIn(h, l.itemId, d.warehouseId, q, avg(l.itemId)); });
      post(h, [{ a: K.inventory, dr: cost }, { a: K.cogs, cr: cost }]);
    }));
    list('assemblies').forEach(d => ev(d.date, 1.5, d, () => {
      const h = { date: d.date, no: d.no, type: 'Production', docId: d.id, route: '#/boms' };
      const bom = (db.boms || []).find(b => b.id === d.bomId); if (!bom) return;
      const n = U.num(d.qty); let val = 0;
      bom.lines.forEach(l => { const q = U.num(l.qty) * n; if (q && isStock(l.itemId)) val += mOut(h, l.itemId, d.warehouseId, q); });
      const oh = U.num(bom.overhead) * n;
      if (n) { const got = mIn(h, bom.itemId, d.warehouseId, n, (val + oh) / n); const diff = U.r2(got - val - oh); if (diff) post(Object.assign({}, h, { memo: 'Rounding' }), [{ a: K.inventory, dr: diff > 0 ? diff : 0, cr: diff < 0 ? -diff : 0 }, { a: K.stockAdj, cr: diff > 0 ? diff : 0, dr: diff < 0 ? -diff : 0 }]); }
      if (oh) post(Object.assign(h, { memo: 'Production overhead' }), [{ a: K.inventory, dr: oh }, { a: bom.overheadAccountId || K.purchaseExpense, cr: oh }]);
    }));
    list('adjustments').forEach(d => ev(d.date, 2, d, () => {
      const h = { date: d.date, no: d.no, type: 'Inventory Adjustment', docId: d.id, route: '#/adjustments/' + d.id, memo: d.reason || 'Inventory adjustment' };
      let gain = 0;
      d.lines.forEach(l => {
        const q = U.num(l.qty); if (!l.itemId || !q || !isStock(l.itemId)) return;
        if (q > 0) gain += mIn(h, l.itemId, d.warehouseId, q, U.num(l.cost) || avg(l.itemId));
        else gain -= mOut(h, l.itemId, d.warehouseId, -q);
      });
      const ac = d.accountId || K.stockAdj;
      if (gain > 0) post(h, [{ a: K.inventory, dr: gain }, { a: ac, cr: gain }]);
      else if (gain < 0) post(h, [{ a: ac, dr: -gain }, { a: K.inventory, cr: -gain }]);
    }));
    // ---------- location transfers (order 3) ----------
    list('issues').forEach(d => ev(d.date, 3, d, () => {
      const h = { date: d.date, no: d.no, type: 'Issue to Location', docId: d.id, route: '#/issues/' + d.id };
      d.lines.forEach(l => { const q = U.num(l.qty); if (!l.itemId || !q || !isStock(l.itemId)) return; const c = avg(l.itemId);
        mv(h, l.itemId, d.fromWarehouseId, -q, c, { transfer: true }); mv(h, l.itemId, TRANSIT, q, c, { transfer: true, dest: d.toWarehouseId }); });
    }));
    list('locReceipts').forEach(d => ev(d.date, 3.5, d, () => {
      const h = { date: d.date, no: d.no, type: 'Receipt in Location', docId: d.id, route: '#/loc-receipts/' + d.id };
      d.lines.forEach(l => { const q = U.num(l.qty); if (!l.itemId || !q || !isStock(l.itemId)) return; const c = avg(l.itemId);
        mv(h, l.itemId, TRANSIT, -q, c, { transfer: true }); mv(h, l.itemId, d.toWarehouseId, q, c, { transfer: true }); });
    }));
    // ---------- stock OUT documents (order 4) ----------
    list('deliveryNotes').forEach(d => ev(d.date, 4, d, () => {
      const h = hd(d, 'Delivery Note', '#/delivery-notes/' + d.id, 'Goods delivered — ' + partyName('C', d.customerId), 'C', d.customerId);
      let cost = 0;
      d.lines.forEach(l => { const q = U.num(l.qty); if (l.itemId && q && isStock(l.itemId)) cost += mOut(h, l.itemId, d.warehouseId, q); });
      post(h, [{ a: K.cogs, dr: cost }, { a: K.inventory, cr: cost }]);
    }));
    list('invoices').forEach(d => ev(d.date, 4, d, () => {
      const t = calcDoc(d), h = hd(d, 'Invoice', '#/invoices/' + d.id, 'Sale — ' + partyName('C', d.customerId), 'C', d.customerId);
      const ls = [{ a: K.ar, dr: t.total, pt: 'C', pid: d.customerId }];
      let cogs = 0;
      d.lines.forEach(l => {
        if (!l.itemId) return;
        ls.push({ a: incAcc(l.itemId), cr: l.amount, memo: item(l.itemId)?.name });
        if (!d.dnId && isStock(l.itemId) && U.num(l.qty)) cogs += mOut(h, l.itemId, d.warehouseId, U.num(l.qty));
      });
      if (t.other) ls.push({ a: K.sales, cr: t.other, memo: 'Other charges' });
      ls.push({ a: K.outputTax, cr: t.tax });
      if (cogs) ls.push({ a: K.cogs, dr: cogs, memo: 'Cost of goods sold' }, { a: K.inventory, cr: cogs, memo: 'Cost of goods sold' });
      if (U.num(d.receivedAmount) && d.receivedAccountId) ls.push({ a: d.receivedAccountId, dr: U.num(d.receivedAmount), memo: 'Received on invoice' }, { a: K.ar, cr: U.num(d.receivedAmount), pt: 'C', pid: d.customerId, memo: 'Received on invoice' });
      post(h, ls);
    }));
    list('purchaseReturns').forEach(d => ev(d.date, 4, d, () => {
      const t = calcDoc(d), h = hd(d, 'Purchase Return', '#/purchase-returns/' + d.id, 'Purchase return — ' + partyName('S', d.supplierId), 'S', d.supplierId);
      const ls = [{ a: K.ap, dr: t.total, pt: 'S', pid: d.supplierId }, { a: K.inputTax, cr: t.tax }];
      let credit = t.other;
      d.lines.forEach(l => {
        if (!l.itemId) return;
        if (isStock(l.itemId) && U.num(l.qty)) { const v = mOut(h, l.itemId, d.warehouseId, U.num(l.qty)); ls.push({ a: K.inventory, cr: v, memo: item(l.itemId)?.name }); credit += l.amount - v; }
        else ls.push({ a: item(l.itemId)?.expenseAccountId || K.purchaseExpense, cr: l.amount, memo: item(l.itemId)?.name });
      });
      credit = U.r2(credit);
      if (credit > 0) ls.push({ a: K.stockAdj, cr: credit, memo: 'Return price difference' }); else if (credit < 0) ls.push({ a: K.stockAdj, dr: -credit, memo: 'Return price difference' });
      if (U.num(d.refundAmount) && d.refundAccountId) ls.push({ a: d.refundAccountId, dr: U.num(d.refundAmount), memo: 'Refund received' }, { a: K.ap, cr: U.num(d.refundAmount), pt: 'S', pid: d.supplierId, memo: 'Refund received' });
      post(h, ls);
    }));
    list('consumptions').forEach(d => ev(d.date, 4, d, () => {
      const h = { date: d.date, no: d.no, type: 'Inventory Consumption', docId: d.id, route: '#/consumptions/' + d.id, memo: d.memo || 'Inventory consumed', projectId: d.projectId || '' };
      let v = 0;
      d.lines.forEach(l => { const q = U.num(l.qty); if (l.itemId && q && isStock(l.itemId)) v += mOut(h, l.itemId, d.warehouseId, q); });
      post(h, [{ a: d.accountId || K.purchaseExpense, dr: v }, { a: K.inventory, cr: v }]);
    }));
    // ---------- money (order 5) ----------
    list('receipts').forEach(d => ev(d.date, 5, d, () => post(
      { date: d.date, no: d.no, type: 'Payment Received', docId: d.id, route: '#/receipts', memo: (d.memo || 'Payment received') + ' — ' + partyName('C', d.customerId) },
      [{ a: d.accountId, dr: U.num(d.amount) }, { a: K.ar, cr: U.num(d.amount) + U.num(d.wht), pt: 'C', pid: d.customerId }, { a: K.advanceTax, dr: U.num(d.wht), memo: 'Tax withheld by customer' }])));
    list('payments').forEach(d => ev(d.date, 5, d, () => post(
      { date: d.date, no: d.no, type: 'Payment Made', docId: d.id, route: '#/payments', memo: (d.memo || 'Payment made') + ' — ' + partyName('S', d.supplierId) },
      [{ a: K.ap, dr: U.num(d.amount) + U.num(d.wht), pt: 'S', pid: d.supplierId }, { a: d.accountId, cr: U.num(d.amount) }, { a: K.whtPayable, cr: U.num(d.wht), memo: 'Tax withheld' }])));
    list('expenses').forEach(d => ev(d.date, 5, d, () => {
      const sub = U.sum(d.lines, l => U.num(l.amount)), tax = U.r2(sub * U.num(d.taxRate) / 100), tot = U.r2(sub + tax);
      const h = { date: d.date, no: d.no, type: 'Expense', docId: d.id, route: '#/expenses/' + d.id, memo: d.memo || 'Expense', projectId: d.projectId || '' };
      const ls = d.lines.map(l => ({ a: l.accountId, dr: U.num(l.amount), memo: l.memo }));
      ls.push({ a: K.inputTax, dr: tax });
      if (d.paidThrough === 'credit') ls.push({ a: K.ap, cr: tot, pt: 'S', pid: d.supplierId }); else ls.push({ a: d.paidThrough, cr: tot });
      post(h, ls);
    }));
    list('vouchers').forEach(d => ev(d.date, 5, d, () => {
      const pay = d.kind === 'Payment';
      const h = { date: d.date, no: d.no, type: pay ? 'Money Out' : 'Money In', docId: d.id, route: '#/vouchers/' + d.id, memo: d.memo };
      const total = U.sum(d.lines, l => U.num(l.amount));
      const ls = d.lines.map(l => ({ a: l.accountId, dr: pay ? U.num(l.amount) : 0, cr: pay ? 0 : U.num(l.amount), memo: l.memo, pt: l.partyType, pid: l.partyId }));
      ls.push({ a: d.accountId, dr: pay ? 0 : total, cr: pay ? total : 0, memo: d.memo });
      post(h, ls);
    }));
    list('fundTransfers').forEach(d => ev(d.date, 5, d, () => post(
      { date: d.date, no: d.no, type: 'Fund Transfer', docId: d.id, route: '#/cash-banks', memo: d.memo || 'Fund transfer' },
      [{ a: d.toAccountId, dr: U.num(d.amount) }, { a: d.fromAccountId, cr: U.num(d.amount) + U.num(d.charges) }, { a: 'a5208', dr: U.num(d.charges), memo: 'Bank charges' }])));
    list('taxPayments').forEach(d => ev(d.date, 5, d, () => post(
      { date: d.date, no: d.no, type: 'Tax Payment', docId: d.id, route: '#/tax-payments', memo: d.memo || 'Tax paid' },
      [{ a: d.taxAccountId, dr: U.num(d.amount) }, { a: d.accountId, cr: U.num(d.amount) }])));
    list('journals').forEach(d => ev(d.date, 5, d, () => post(
      { date: d.date, no: d.no, type: 'Journal', docId: d.id, route: '#/journals/' + d.id, memo: d.memo },
      d.lines.map(l => ({ a: l.accountId, dr: l.debit, cr: l.credit, memo: l.memo, pt: l.partyType, pid: l.partyId, prj: l.projectId })))));

    events.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.order - b.order || a.t - b.t).forEach(e => e.fn());
    return { lines, moves, inv };
  },
};

/* ---------------- transaction locking & recurring ---------------- */
const isLocked = date => { const l = DB.data.settings.lockDate; return !!(l && date && date <= l); };
const lockMsg = () => `Transactions up to ${U.fdate(DB.data.settings.lockDate)} are locked`;
const FREQ = { weekly: ['Weekly', d => U.addDays(d, 7)], monthly: ['Monthly', d => addMonths(d, 1)], quarterly: ['Quarterly', d => addMonths(d, 3)], yearly: ['Yearly', d => addMonths(d, 12)] };
function addMonths(d, n) { const [y, m, day] = d.split('-').map(Number); const x = new Date(Date.UTC(y, m - 1 + n, 1)); const last = new Date(Date.UTC(x.getUTCFullYear(), x.getUTCMonth() + 1, 0)).getUTCDate(); x.setUTCDate(Math.min(day, last)); return x.toISOString().slice(0, 10); }
const REC_KEYS = { invoice: ['invoices', 'INV'], bill: ['bills', 'BILL'], expense: ['expenses', 'EXP'], journal: ['journals', 'JV'] };
function runRecurring() {
  const today = U.today(); let made = 0;
  (DB.data.recurring || []).forEach(r => {
    if (r.paused) return;
    const [key, prefix] = REC_KEYS[r.kind]; const tpl = DB.data[key].find(x => x.id === r.templateId); if (!tpl) return;
    let guard = 0;
    while (r.next && r.next <= today && (!r.end || r.next <= r.end) && guard++ < 120) {
      if (isLocked(r.next)) { r.next = FREQ[r.freq][1](r.next); continue; }
      const c = JSON.parse(JSON.stringify(tpl));
      const shift = c.dueDate ? U.daysBetween(c.date, c.dueDate) : null;
      Object.assign(c, { id: U.uid(), createdAt: Date.now() + made, date: r.next, no: DB.nextNo(prefix), recurringId: r.id });
      if (shift !== null) c.dueDate = U.addDays(r.next, shift);
      delete c.receivedAmount; delete c.paidAmount;
      DB.data[key].push(c); r.count = (r.count || 0) + 1; made++;
      r.next = FREQ[r.freq][1](r.next);
    }
  });
  if (made) DB.save();
  return made;
}

/* ---------------- Report helpers ---------------- */
const R = {
  lines(f = {}) {
    let ls = Ledger.get().lines;
    if (f.from) ls = ls.filter(l => l.date >= f.from);
    if (f.to) ls = ls.filter(l => l.date <= f.to);
    if (f.accounts) { const s = new Set(f.accounts); ls = ls.filter(l => s.has(l.accountId)); }
    return ls;
  },
  // signed balance: debit - credit
  bal(accountIds, f) { return U.r2(U.sum(this.lines(Object.assign({}, f, { accounts: accountIds })), l => l.debit - l.credit)); },
  accBal(id, f) { return this.bal(descendants(id), f); },
  partyLines(type, id, f = {}) { return this.lines(f).filter(l => l.partyType === type && l.partyId === id); },
  partyBal(type, id, to) { const b = U.sum(this.partyLines(type, id, { to }), l => l.debit - l.credit); return U.r2(type === 'C' ? b : -b); },
  profit(f) {
    const ids = DB.data.accounts.filter(a => !a.isGroup && (a.type === 'Income' || a.type === 'Expense')).map(a => a.id);
    return -this.bal(ids, f);
  },
  stock(to, whId) {
    const res = {};
    Ledger.get().moves.forEach(m => {
      if (to && m.date > to) return;
      if (whId && m.warehouseId !== whId) return;
      const r = res[m.itemId] || (res[m.itemId] = { qty: 0, value: 0 });
      r.qty += m.qty; r.value += m.value;
    });
    return res;
  },
  // FIFO allocation of party balance to open documents
  openDocs(type, id, asOf) {
    const docs = (type === 'C' ? DB.data.invoices.filter(d => d.customerId === id) : DB.data.bills.filter(d => d.supplierId === id))
      .filter(d => !asOf || d.date <= asOf).map(d => ({ d, total: U.r2(calcDoc(d).total - (d.receivedAccountId ? U.num(d.receivedAmount) : 0) - (d.paidAccountId ? U.num(d.paidAmount) : 0)), full: calcDoc(d).total }));
    const p = party(type, id);
    if (U.num(p?.opening) > 0) docs.push({ d: { id: 'ob', no: 'Opening', date: DB.data.settings.openingDate }, total: U.num(p.opening) });
    docs.sort((a, b) => b.d.date.localeCompare(a.d.date) || (b.d.createdAt || 0) - (a.d.createdAt || 0));
    let remaining = this.partyBal(type, id, asOf);
    const out = {};
    docs.forEach(x => { const o = Math.max(0, Math.min(remaining, x.total)); out[x.d.id] = { doc: x.d, total: x.full || x.total, open: U.r2(o) }; remaining -= o; });
    return out;
  },
  docStatus(type, doc) {
    const o = this.openDocs(type, type === 'C' ? doc.customerId : doc.supplierId)[doc.id];
    if (!o) return 'Draft';
    if (o.open <= 0.005) return 'Paid';
    if (o.open < o.total - 0.005) return 'Partial';
    const terms = U.num(party(type, type === 'C' ? doc.customerId : doc.supplierId)?.terms);
    return U.daysBetween(doc.dueDate || U.addDays(doc.date, terms), U.today()) > 0 ? 'Overdue' : 'Unpaid';
  },
};

/* ---------------- Router ---------------- */
const Routes = [];
const route = (pattern, fn) => Routes.push({ re: new RegExp('^' + pattern.replace(/:(\w+)/g, '([^/]+)') + '$'), fn });
function navigate() {
  const h = (location.hash || '#/dashboard').slice(1);
  const path = h.split('?')[0];
  const qs = Object.fromEntries(new URLSearchParams(h.split('?')[1] || ''));
  document.body.classList.remove('nav-open');
  closeModal();
  for (const r of Routes) {
    const m = path.match(r.re);
    if (m) { renderNav(); window.scrollTo(0, 0); try { r.fn(...m.slice(1).map(decodeURIComponent), qs); } catch (e) { console.error(e); page('Error', `<div class="card pad"><p>Something went wrong: ${U.esc(e.message)}</p></div>`); } return; }
  }
  location.hash = '#/dashboard';
}
const go = h => { if (location.hash === h) navigate(); else location.hash = h; };

function toast(msg, kind = 'ok') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg;

}
function alertBox(msg) { toast(msg, 'err'); }
function modal(title, body, foot, wide) {

  $$('#modalRoot [data-close]').forEach(b => b.onclick = closeModal);
  $('#modalRoot .overlay').addEventListener('mousedown', e => { if (e.target.classList.contains('overlay')) closeModal(); });
  setTimeout(() => $('#modalRoot input:not([type=hidden]), #modalRoot select')?.focus(), 30);

}
function closeModal() { const r = $('#modalRoot'); if (r) r.innerHTML = ''; }

}

/* ---------------- Form helpers ---------------- */

function field(f, v) {
  const id = 'f_' + f.name, req = f.required ? 'required' : '';
  const lab = `<label for="${id}">${U.esc(f.label)}${f.required ? ' <i class="req">*</i>' : ''}</label>`;

  if (f.type === 'select') inp = `<select id="${id}" name="${f.name}" ${req}>${typeof f.options === 'function' ? f.options(v) : f.options}</select>`;
  else if (f.type === 'textarea') inp = `<textarea id="${id}" name="${f.name}" rows="2">${U.esc(v)}</textarea>`;
  else if (f.type === 'checkbox') return `<div class="fld ${f.wide ? 'wide' : ''} chk"><label><input type="checkbox" name="${f.name}" ${v ? 'checked' : ''}> ${U.esc(f.label)}</label>${f.hint ? `<small>${f.hint}</small>` : ''}</div>`;
  else inp = `<input id="${id}" name="${f.name}" type="${f.type || 'text'}" ${f.type === 'number' ? 'step="any"' : ''} value="${U.esc(v ?? '')}" ${req} ${f.list ? `list="${f.list}"` : ''} ${f.placeholder ? `placeholder="${U.esc(f.placeholder)}"` : ''}>`;

/* ---------------- Table helper ---------------- */
function table(cols, rows, opt = {}) {
  if (!rows.length) return `<div class="empty">${opt.empty || 'No records yet.'}</div>`;
  const head = cols.map(c => `<th class="${c.cls || ''}">${c.label}</th>`).join('');
  const body = rows.map((r, i) => `<tr ${opt.rowAttr ? opt.rowAttr(r, i) : ''}>${cols.map(c => `<td class="${c.cls || ''}">${c.html ? c.html(r) : U.esc(c.get(r))}</td>`).join('')}</tr>`).join('');
  const foot = opt.foot ? `<tfoot><tr>${opt.foot.map(f => `<td class="${f.cls || ''}">${f.v ?? ''}</td>`).join('')}</tr></tfoot>` : '';
  return `<div class="tbl-wrap"><table class="tbl ${opt.cls || ''}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>`;
}

/* ---------------- CSV export ---------------- */
function exportTableCSV(tableEl, name) {
  const rows = $$('tr', tableEl).map(tr => $$('th,td', tr).map(td => `"${td.innerText.replace(/"/g, '""').trim()}"`).join(','));
  const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '.csv'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function bindRowLinks(root = document) {
  $$('tr[data-href]', root).forEach(tr => tr.addEventListener('click', e => { if (!e.target.closest('a,button,input')) go(tr.dataset.href); }));
}

}

<script>

function masterPage(cfg) {
  const render = (q = '') => {
    let rows = DB.data[cfg.key].slice();
    if (cfg.sort) rows.sort(cfg.sort);
    if (q) { const s = q.toLowerCase(); rows = rows.filter(r => JSON.stringify(r).toLowerCase().includes(s)); }
    $('#mList').innerHTML = table(cfg.columns, rows, { rowAttr: r => `data-id="${r.id}" class="clickable"`, empty: `No ${cfg.title.toLowerCase()} yet. Click <b>New ${cfg.singular}</b> to add one.`, foot: cfg.foot ? cfg.foot(rows) : null });
    $$('#mList tr[data-id]').forEach(tr => tr.addEventListener('click', e => { if (!e.target.closest('a,button')) edit(DB.get(cfg.key, tr.dataset.id)); }));
  };
  const edit = rec => {
    const isNew = !rec;
    rec = rec ? Object.assign({}, rec) : Object.assign({}, typeof cfg.defaults === 'function' ? cfg.defaults() : cfg.defaults || {});
    const m = modal((isNew ? 'New ' : 'Edit ') + cfg.singular, `<form id="mForm" class="grid2">${cfg.fields.map(f => field(f, rec[f.name])).join('')}</form>${cfg.extraForm ? cfg.extraForm(rec) : ''}`,
      `${!isNew ? `<button class="btn danger ghost" id="mDel">${icon('trash')} Delete</button>` : ''}<span class="sp"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="mSave">Save</button>`);
    const form = $('#mForm', m);
    if (cfg.onFormReady) cfg.onFormReady(form, rec);
    form.onsubmit = e => { e.preventDefault(); $('#mSave').click(); };
    $('#mSave', m).onclick = () => {
      const v = readForm(form);
      for (const f of cfg.fields) if (f.required && !v[f.name]) return toast(`${f.label} is required`, 'err');
      for (const f of cfg.fields) if (f.type === 'number') v[f.name] = U.num(v[f.name]);
      const out = Object.assign(rec, v);
      const err = cfg.validate && cfg.validate(out, isNew);
      if (err) return toast(err, 'err');
      if (cfg.beforeSave) cfg.beforeSave(out, isNew);
      DB.upsert(cfg.key, out); closeModal(); toast(cfg.singular + ' saved'); render($('#mSearch').value);
      if (cfg.afterSave) cfg.afterSave(out);
    };
    if (!isNew) $('#mDel', m).onclick = () => {
      const why = cfg.cannotDelete && cfg.cannotDelete(rec);
      if (why) return toast(why, 'err');
      confirmBox(`Delete ${cfg.singular.toLowerCase()} "${rec.name}"?`, () => { DB.remove(cfg.key, rec.id); toast('Deleted'); render(); });
    };
  };
  page(cfg.title, `<div class="card"><div class="toolbar"><div class="search">${icon('search')}<input id="mSearch" placeholder="Search ${cfg.title.toLowerCase()}…"></div>${cfg.toolbar || ''}</div><div id="mList"></div></div>`,
    `<button class="btn primary" id="mNew">${icon('plus')} New ${cfg.singular}</button>`, cfg.crumbs);
  $('#mNew').onclick = () => edit();
  $('#mSearch').oninput = e => render(e.target.value);
  render();
  return { edit, render };
}

function autoCode(key, prefix) {
  const n = DB.data[key].length + 1;
  let code; let i = n;
  do { code = prefix + String(i++).padStart(4, '0'); } while (DB.data[key].some(x => x.code === code));
  return code;
}
const uniqueCode = (key, rec) => rec.code && DB.data[key].some(x => x.code === rec.code && x.id !== rec.id) ? `Code "${rec.code}" is already used` : null;

/* ---------------- Customers / Suppliers ---------------- */
function partyPage(type) {

  masterPage({
    key, title: C ? 'Customers' : 'Suppliers', singular: C ? 'Customer' : 'Supplier',

      { label: '', cls: 'num', html: r => `<a class="lnk" href="#/reports/${C ? 'customer' : 'supplier'}-ledger?id=${r.id}">Ledger</a>` },
    ],
    foot: rows => [{}, { v: '<b>Total</b>' }, {}, {}, {}, { cls: 'num', v: `<b>${U.money(U.sum(rows, r => R.partyBal(type, r.id)))}</b>` }, {}],
    fields: [
      { name: 'code', label: 'Code', placeholder: 'Auto' },

      { name: 'contact', label: 'Contact person' },
      { name: 'phone', label: 'Phone' },
      { name: 'email', label: 'Email', type: 'email' },
      { name: 'city', label: 'City' },
      { name: 'address', label: 'Address', type: 'textarea', wide: true },
      { name: 'ntn', label: 'NTN / CNIC' },
      { name: 'strn', label: 'STRN' },
      { name: 'terms', label: 'Credit terms (days)', type: 'number' },

    cannotDelete: r => Object.keys(DB.data).some(k => Array.isArray(DB.data[k]) && DB.data[k].some(d => d && (d[C ? 'customerId' : 'supplierId'] === r.id || (d.lines || []).some(l => l.partyId === r.id))))

}

      { name: 'expenseAccountId', label: 'Expense account (service purchases)', type: 'select', options: v => accOpts(v, leafAccounts().filter(a => a.type === 'Expense' || a.type === 'Asset')).replace('— Select —', '— Default —') },
      { name: 'openingQty', label: 'Opening quantity', type: 'number' },
      { name: 'openingCost', label: 'Opening unit cost', type: 'number' },
      { name: 'openingWarehouse', label: 'Opening warehouse', type: 'select', options: v => whOpts(v) },

    cannotDelete: r => Object.keys(DB.data).some(k => Array.isArray(DB.data[k]) && DB.data[k].some(d => d && ((d.lines || []).some(l => l.itemId === r.id) || d.itemId === r.id))) ? 'This item has transactions and cannot be deleted' : null,

route('/accounts', () => {
  const linked = new Set(Object.values(L()));
  const types = ['Asset', 'Liability', 'Equity', 'Income', 'Expense'];
  const render = () => {
    const A = DB.data.accounts;
    const kids = p => A.filter(a => (a.parentId || '') === p).sort((a, b) => a.code.localeCompare(b.code));
    const rows = [];
    const walk = (p, d) => kids(p).forEach(a => { rows.push({ a, d }); walk(a.id, d + 1); });
    walk('', 0);
    $('#coa').innerHTML = `<div class="tbl-wrap"><table class="tbl coa"><thead><tr><th>Code</th><th>Account</th><th>Type</th><th class="num">Balance</th></tr></thead><tbody>${rows.map(({ a, d }) => {
      const b = R.accBal(a.id); const shown = NORMAL_DEBIT[a.type] ? b : -b;
      return `<tr data-id="${a.id}" class="clickable ${a.isGroup ? 'grp' : ''}"><td>${U.esc(a.code)}</td><td style="padding-left:${12 + d * 22}px">${a.isGroup ? '<b>' + U.esc(a.name) + '</b>' : U.esc(a.name)} ${a.cashBank ? '<span class="tag">Cash/Bank</span>' : ''} ${linked.has(a.id) ? '<span class="tag t2">Linked</span>' : ''}</td><td>${a.type}</td><td class="num">${a.isGroup ? '<b>' + U.money(shown) + '</b>' : `<a class="lnk" href="#/reports/general-ledger?account=${a.id}">${U.money(shown)}</a>`}</td></tr>`;
    }).join('')}</tbody></table></div>`;
    $$('#coa tr[data-id]').forEach(tr => tr.addEventListener('click', e => { if (!e.target.closest('a')) edit(acc(tr.dataset.id)); }));
  };
  const edit = rec => {
    const isNew = !rec || !rec.id;
    rec = Object.assign({ isGroup: false, type: 'Asset' }, rec || {});
    const groups = DB.data.accounts.filter(a => a.isGroup && a.id !== rec.id).sort((a, b) => a.code.localeCompare(b.code));
    const m = modal(isNew ? 'New account' : 'Edit account', `<form id="aForm" class="grid2">
      ${field({ name: 'parentId', label: 'Parent group', type: 'select', options: v => opts(groups.map(g => [g.id, `${g.code} · ${g.name}`]), v, '— Top level —') }, rec.parentId)}
      ${field({ name: 'type', label: 'Account type', type: 'select', options: v => opts(types.map(t => [t, t]), v, null) }, rec.type)}
      ${field({ name: 'code', label: 'Account code', required: true }, rec.code)}
      ${field({ name: 'name', label: 'Account name', required: true }, rec.name)}
      ${field({ name: 'isGroup', label: 'This is a group (heading) account', type: 'checkbox', hint: 'Group accounts hold other accounts and cannot be posted to.' }, rec.isGroup)}
      ${field({ name: 'cashBank', label: 'Cash or bank account', type: 'checkbox', hint: 'Shows in receipt/payment account lists.' }, rec.cashBank)}
      ${field({ name: 'opening', label: 'Opening balance', type: 'number', hint: 'In the account’s normal direction (debit for assets/expenses, credit for liabilities/equity/income).' }, rec.opening)}
    </form>`, `${!isNew ? `<button class="btn danger ghost" id="aDel">${icon('trash')} Delete</button>` : ''}<span class="sp"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="aSave">Save</button>`);
    const f = $('#aForm', m);
    f.parentId.onchange = () => { const p = acc(f.parentId.value); if (p) { f.type.value = p.type; if (!f.code.value) { const sib = DB.data.accounts.filter(a => a.parentId === p.id).map(a => +a.code).filter(Number.isFinite); f.code.value = sib.length ? Math.max(...sib) + 1 : p.code + '01'; } } };
    $('#aSave', m).onclick = () => {
      const v = readForm(f);
      if (!v.code || !v.name) return toast('Code and name are required', 'err');
      if (DB.data.accounts.some(a => a.code === v.code && a.id !== rec.id)) return toast('Account code already exists', 'err');
      const hasLines = !isNew && R.lines({ accounts: [rec.id] }).length;
      if (v.isGroup && hasLines) return toast('This account has postings; it cannot become a group', 'err');
      if (v.isGroup && linked.has(rec.id)) return toast('Linked accounts cannot be groups', 'err');
      if (!v.isGroup && !isNew && DB.data.accounts.some(a => a.parentId === rec.id)) return toast('This account has sub-accounts; it must stay a group', 'err');
      v.opening = U.num(v.opening);
      DB.upsert('accounts', Object.assign(rec, v)); closeModal(); toast('Account saved'); render();
    };
    if (!isNew) $('#aDel', m).onclick = () => {
      if (linked.has(rec.id)) return toast('This account is linked in Account Linking settings', 'err');
      if (DB.data.accounts.some(a => a.parentId === rec.id)) return toast('Delete or move its sub-accounts first', 'err');
      if (R.lines({ accounts: [rec.id] }).length) return toast('This account has postings and cannot be deleted', 'err');
      confirmBox(`Delete account "${rec.name}"?`, () => { DB.remove('accounts', rec.id); render(); });
    };
  };
  page('Chart of Accounts', `<div class="card"><div class="toolbar"><span class="muted">Click any account to edit. Balances shown in normal direction.</span></div><div id="coa"></div></div>`,
    `<button class="btn" id="exCoa">${icon('dl')} Export</button><button class="btn primary" id="newAcc">${icon('plus')} New Account</button>`);
  $('#newAcc').onclick = () => edit();
  $('#exCoa').onclick = () => exportTableCSV($('#coa table'), 'chart-of-accounts');
  render();
});

<script>
