  const ms = Ledger.get().moves.filter(m => (!f.wh || m.warehouseId === f.wh) && (f.wh || (!m.transfer)) && m.warehouseId !== TRANSIT);
  const rows = DB.data.items.filter(i => i.type !== 'Service').map(i => { const mine = ms.filter(m => m.itemId === i.id); const pre = mine.filter(m => m.date < f.from), per = mine.filter(m => inP(m, f));
    return { i, open: U.sum(pre, m => m.qty), inq: U.sum(per.filter(m => m.qty > 0), m => m.qty), outq: -U.sum(per.filter(m => m.qty < 0), m => m.qty) }; }).map(r => Object.assign(r, { close: r.open + r.inq - r.outq })).filter(r => r.open || r.inq || r.outq);
  return table([{ label: 'Item', html: r => `<a class="lnk" href="#/reports/item-ledger?item=${r.i.id}&from=${f.from}&to=${f.to}">${U.esc(r.i.name)}</a>` }, { label: 'Unit', get: r => r.i.unit }, { label: 'Opening', cls: 'num', get: r => U.qty(r.open) }, { label: 'In', cls: 'num', get: r => U.qty(r.inq) }, { label: 'Out', cls: 'num', get: r => U.qty(r.outq) }, { label: 'Closing', cls: 'num', html: r => `<b>${U.qty(r.close)}</b>` }], rows, { empty: 'No movement.' });
}));
route('/reports/demand-summary', () => reportPage('demand-summary', 'Demand Summary', ['from', 'to'], f => {
  const rows = DB.data.demands.filter(d => inP(d, f));
  return table([{ label: 'Date', get: d => U.fdate(d.date) }, { label: 'Number', html: d => `<b>${U.esc(d.no)}</b>` }, { label: 'Demanding location', get: d => wh(d.toWarehouseId)?.name }, { label: 'Items', get: d => d.lines.map(l => `${item(l.itemId)?.name} × ${U.qty(l.qty)}`).join(', ') }, { label: 'Status', html: d => badge(issuedFor(d.id).length ? 'Issued' : 'Open') }],
    rows, { rowAttr: d => `data-href="#/demands/${d.id}" class="clickable"`, empty: 'No demands in this period.' });
}));

/* ---- Expenses ---- */
function expenseRows(f, keyFn) {
  const ls = R.lines({ from: f.from, to: f.to }).filter(l => acc(l.accountId)?.type === 'Expense');
  return [...grouped(ls, keyFn)].map(([k, xs]) => ({ k, amount: U.sum(xs, l => l.debit - l.credit), n: xs.length })).filter(r => Math.abs(r.amount) > 0.005).sort((a, b) => b.amount - a.amount);
}
route('/reports/expense-by-account', () => reportPage('expense-by-account', 'Expense By Account', ['from', 'to'], f => {
  const rows = expenseRows(f, l => l.accountId), all = tot(rows, 'amount');
  return table([{ label: 'Account', html: r => `<a class="lnk" href="#/reports/general-ledger?account=${r.k}&from=${f.from}&to=${f.to}">${U.esc(accName(r.k))}</a>` }, { label: 'Entries', cls: 'num', get: r => r.n }, moneyCol('Amount', 'amount', true), { label: '% of total', cls: 'num', get: r => all ? (r.amount / all * 100).toFixed(1) : '' }], rows, { empty: 'No expenses.', foot: [{ v: '<b>Total</b>' }, {}, { cls: 'num', v: `<b>${U.money(all)}</b>` }, {}] });
}));
route('/reports/expense-by-category', () => reportPage('expense-by-category', 'Expense By Category', ['from', 'to'], f => {
  const rows = expenseRows(f, l => acc(l.accountId)?.parentId || ''), all = tot(rows, 'amount');
  return table([{ label: 'Category (account group)', get: r => acc(r.k)?.name || '(Top level)' }, { label: 'Entries', cls: 'num', get: r => r.n }, moneyCol('Amount', 'amount', true), { label: '% of total', cls: 'num', get: r => all ? (r.amount / all * 100).toFixed(1) : '' }], rows, { empty: 'No expenses.', foot: [{ v: '<b>Total</b>' }, {}, { cls: 'num', v: `<b>${U.money(all)}</b>` }, {}] });
}));

/* ---- Projects ---- */
route('/reports/project-summary', () => reportPage('project-summary', 'Project Summary', ['from', 'to'], f => {
  const ls = R.lines({ from: f.from, to: f.to }).filter(l => l.projectId);
  const rows = DB.data.projects.map(p => { const xs = ls.filter(l => l.projectId === p.id); let inc = 0, exp = 0; xs.forEach(l => { const t = acc(l.accountId)?.type; if (t === 'Income') inc += l.credit - l.debit; if (t === 'Expense') exp += l.debit - l.credit; }); return { p, inc, exp, profit: inc - exp, budget: U.num(p.budget) }; });
  return table([{ label: 'Project', html: r => `<a class="lnk" href="#/reports/project-pl?project=${r.p.id}&from=${f.from}&to=${f.to}">${U.esc(r.p.name)}</a>` }, { label: 'Customer', get: r => r.p.customerId ? partyName('C', r.p.customerId) : '' }, { label: 'Status', html: r => badge(r.p.status || 'Active') }, moneyCol('Budget', 'budget'), moneyCol('Income', 'inc'), moneyCol('Cost', 'exp'), { label: 'Profit', cls: 'num', html: r => `<b class="${r.profit < 0 ? 'neg' : ''}">${U.money(r.profit)}</b>` }, { label: 'Margin %', cls: 'num', get: r => r.inc ? (r.profit / r.inc * 100).toFixed(1) : '' }],
    rows, { empty: 'No projects yet.', foot: [{ v: '<b>Total</b>' }, {}, {}, { cls: 'num', v: `<b>${U.money(tot(rows, 'budget'))}</b>` }, { cls: 'num', v: `<b>${U.money(tot(rows, 'inc'))}</b>` }, { cls: 'num', v: `<b>${U.money(tot(rows, 'exp'))}</b>` }, { cls: 'num', v: `<b>${U.money(tot(rows, 'profit'))}</b>` }, {}] });
}));
route('/reports/project-pl', () => reportPage('project-pl', 'Project Profit & Loss', ['project', 'from', 'to'], f => {
  if (!f.project) return '<div class="empty">Choose a project.</div>';
  const ls = R.lines({ from: f.from, to: f.to }).filter(l => l.projectId === f.project);
  const g = type => [...grouped(ls.filter(l => acc(l.accountId)?.type === type), l => l.accountId)].map(([id, xs]) => ({ a: acc(id), v: (type === 'Income' ? -1 : 1) * U.sum(xs, l => l.debit - l.credit) }));
  const inc = g('Income'), exp = g('Expense'), ti = U.sum(inc, r => r.v), te = U.sum(exp, r => r.v);
  const row = r => `<tr><td style="padding-left:32px"><a class="lnk" href="#/reports/general-ledger?account=${r.a.id}">${U.esc(r.a.name)}</a></td><td class="num">${U.money(r.v)}</td></tr>`;
  return `<table class="tbl stmt"><thead><tr><th>${U.esc(DB.get('projects', f.project)?.name || '')}</th><th class="num">${DB.data.settings.currency}</th></tr></thead><tbody>
    <tr class="grp"><td colspan="2"><b>Income</b></td></tr>${inc.map(row).join('')}<tr class="tot"><td>Total income</td><td class="num">${U.money(ti)}</td></tr>
    <tr class="grp"><td colspan="2"><b>Costs & expenses</b></td></tr>${exp.map(row).join('')}<tr class="tot"><td>Total costs</td><td class="num">${U.money(te)}</td></tr>
    <tr class="grand ${ti - te < 0 ? 'neg' : ''}"><td>Project ${ti - te < 0 ? 'loss' : 'profit'}</td><td class="num">${U.money(ti - te)}</td></tr></tbody></table>`;
}));

/* ---- Analytics dashboard ---- */
route('/analytics', () => {
  const s = DB.data.settings, today = U.today(), fy = U.fyStart(today, s.fyStartMonth);
  const months = Array.from({ length: 12 }, (_, i) => addMonths(fy, i).slice(0, 7));
  const mName = m => ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m.slice(5) - 1];
  const ls = R.lines({ from: fy, to: U.addDays(addMonths(fy, 12), -1) });
  const inc = months.map(m => U.sum(ls.filter(l => l.date.startsWith(m) && acc(l.accountId)?.type === 'Income'), l => l.credit - l.debit));
  const exp = months.map(m => U.sum(ls.filter(l => l.date.startsWith(m) && acc(l.accountId)?.type === 'Expense'), l => l.debit - l.credit));
  const max = Math.max(1, ...inc, ...exp), W = 720, H = 220, gw = W / 12;
  const bars = months.map((m, i) => { const hi = Math.max(0, inc[i]) / max * (H - 34), he = Math.max(0, exp[i]) / max * (H - 34), x = i * gw + gw / 2;
    return `<rect x="${x - 15}" y="${H - 20 - hi}" width="14" height="${hi}" rx="2" class="bar-s"><title>Income ${mName(m)}: ${U.money(inc[i])}</title></rect><rect x="${x + 1}" y="${H - 20 - he}" width="14" height="${he}" rx="2" class="bar-p"><title>Expenses ${mName(m)}: ${U.money(exp[i])}</title></rect><text x="${x}" y="${H - 4}" text-anchor="middle" class="axis">${mName(m)}</text>`; }).join('');
  const f = { from: fy, to: today };
  const topC = [...grouped(saleLines(f), l => l.cust)].map(([k, xs]) => ({ n: partyName('C', k), v: tot(xs, 'amount') })).sort((a, b) => b.v - a.v).slice(0, 6);
  const topI = [...grouped(saleLines(f), l => l.itemId)].map(([k, xs]) => ({ n: item(k)?.name || '?', v: tot(xs, 'amount') })).sort((a, b) => b.v - a.v).slice(0, 6);
  const topE = expenseRows(f, l => l.accountId).slice(0, 6).map(r => ({ n: acc(r.k)?.name, v: r.amount }));
  const hbars = (rows, cls) => { const mx = Math.max(1, ...rows.map(r => r.v)); return rows.length ? rows.map(r => `<div class="hb"><span>${U.esc(r.n)}</span><div><i class="${cls}" style="width:${Math.max(2, r.v / mx * 100)}%"></i></div><b>${U.money(r.v)}</b></div>`).join('') : '<div class="empty">No data yet.</div>'; };
  const ti = U.sum(inc), te = U.sum(exp), gp = ti - U.sum(ls.filter(l => descendants('g51').includes(l.accountId)), l => l.debit - l.credit);
  page('Analytics', `<div class="kpis">
      <div class="kpi"><span>Income this year</span><b>${U.money(ti)}</b></div><div class="kpi"><span>Expenses this year</span><b>${U.money(te)}</b></div>
      <div class="kpi ${ti - te < 0 ? 'neg' : 'pos'}"><span>Net profit</span><b>${U.money(ti - te)}</b></div><div class="kpi"><span>Gross margin</span><b>${ti ? (gp / ti * 100).toFixed(1) + '%' : '—'}</b></div>
      <div class="kpi"><span>Invoices this year</span><b>${DB.data.invoices.filter(d => d.date >= fy).length}</b></div></div>
    <div class="card pad"><div class="card-h"><h3>Income vs expenses by month</h3><span class="legend"><i class="lg-s"></i>Income <i class="lg-p"></i>Expenses</span></div><svg viewBox="0 0 ${W} ${H}" class="chart"><line x1="0" x2="${W}" y1="${H - 20}" y2="${H - 20}" class="base"/>${bars}</svg></div>
    <div class="grid-3"><div class="card pad"><h3>Top customers</h3>${hbars(topC, 'c1')}</div><div class="card pad"><h3>Top selling items</h3>${hbars(topI, 'c2')}</div><div class="card pad"><h3>Top expenses</h3>${hbars(topE, 'c3')}</div></div>`);
});

</script>
